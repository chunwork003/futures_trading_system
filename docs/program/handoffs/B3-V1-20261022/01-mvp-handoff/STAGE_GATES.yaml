risk_review_policy:
  unit_targeted: Every Unit keeps its exact required case IDs, negative/race tests and mandatory independent review.
  high_level_stage_review: Higher-capability GPT reviews R1 integration,R2 research contract,R3 full selected E2E after
    complete feature group; R0 reviews source/profile only when needed, not a new fullB3 review.
  ordinary_Unit_review: Qualified independent Reviewer under existing contract; does not inherently require Ultra. Author
    cannot review their own result as independent.
  trigger_immediate_architecture_escalation:
  - New evidence-supported major architecture/safety contradiction
  - Protected authority/schema/identity/capital/order/fill semantic change
  - Scope/budget/Writer/qualification conflict not resolvable under current authority
  not_global_reopen:
  - Cosmetic UI
  - Ordinary internal algorithm or naming
  - Known deferred resource/Host availability
  - Already closed findings with no affected source drift

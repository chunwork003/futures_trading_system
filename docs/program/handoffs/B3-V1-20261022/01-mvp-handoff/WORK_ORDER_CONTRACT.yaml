existing_native_records:
  implementation: automation/engine/contracts.py
  models:
  - WorkPackageRecord
  - AuthorizationRecord
  rule: Preserve closed native top-level fields. Below checklist is not serialized as a new native record or accepted
    by a substitute compiler. Existing WORK compiles original schema and explicit Unit bindings.
required_before_CODE:
  unit_id_feature_id_chapter_revision_source_revision: Exact accepted source Subject + Unit selector + current revision/hash;
    resolve v9 and B-TRACE companion. Never trust latest filename.
  dependencies: Each incoming original Unit DAG edge needs exact Accepted Result plus external Acceptance or source-qualified
    scoped reuse. Missing upstream Result != satisfied. Source-only API modes are not new runtime edges.
  allowed_changes: Approved exact files with operation CREATE_NEW/MODIFY and worktree/raw/Git preimages; planning aliases
    are proposals. No wildcard. Name tests/generated/build artifacts/control-plane writes too.
  protected_contracts: Accepted predecessor bytes/IDs/schemas/receipts/history/data/Secrets/current state and other lanes
    preserved; Current updates only if exact scope permits.
  input_output_interface_contract: Single source for API operation/DTO/Schema/wire version/producer/consumer/Auth/error/retry/unknown/idempotency;
    frontend/mocks do not fork semantics.
  source_assembly_context: Mandatory original/reverse/companion source closure present with exact dialect/selectors/hash
    domain; body readback, explicit unread/UNKNOWN. HASH/SUMMARY is not body; unqualified Source/Context/Result/Intake
    remains HOLD.
  executor_mode_profile: Actual qualified intended use, operator/thread/tool identity/versions and continuity; exact
    capacity/profile applicability. No automatic transfer from U01/U02/HUMAN_DIALOGUE to another Unit or LM.
  database_migration_boundary: Record no-SQL or exact separately approved disposable environment/DDL/migration boundary;
    no implicit production IO.
  test_cases_negative_cases: All Unit verification_contract required IDs plus positive/negative/race cases; targeted
    commands fixed with exact argv/cwd/env/raw output paths/exit/time/JUnit. Test specification != actual result.
  expected_evidence: RequiredEvidenceContract separate from UnitExecutionResult.actual_evidence/ExpectedEvidence. Full
    result excluding top ref follows original canonical hash; immutable result plus exact review/acceptance, no outcome
    rewrite.
  acceptance_gate: Original contract gate, independent reviewer identity and WORK Intake/Integration then separately
    authorized acceptance. No author self ACCEPTED.
  risk_level_model_capability_requirement: From actual influence/contract, not IDE or milestone. Scope/Registry/capital/order/fill/source
    authority require original high-risk checks.
  estimated_cost_budget: Exact current forecast/confidence or null+reason UNKNOWN; finite initial/correction/review-fix
    caps and external API/spend limits. Human accepts applicable UNKNOWN; no shared account proxy presented as exact
    task billing.
  Grant_and_single_writer: Current effective exact Human/native authority, one new single-use Grant/reservation/Writer
    lineage, no overlap with other run; no model-invented signature.
  STOP_conditions: Source/qualification/current drift, ambiguous authority, Writer conflict, denied provider, missing
    evidence, unsafe effect/scope or exhausted correction budget, reviewer finding outside authorization => STOP affected
    route; preserve checkpoint.
single_use_order:
- FRESH_AUTHORITY_RESOLUTION
- FRESH_ELIGIBILITY_EVALUATION
- ACQUIRE_GLOBAL_RUNTIME_WRITER_LOCK
- ALLOCATE_EXECUTION_ID
- DURABLY_CREATE_EXECUTION_RESERVATION
- STATE_TO_RESERVED
- RECHECK_LOCK_HEAD_AND_BINDING
- MARK_DISPATCH_COMMITTED
- STATE_TO_CONSUMED
- INVOKE_EXECUTOR

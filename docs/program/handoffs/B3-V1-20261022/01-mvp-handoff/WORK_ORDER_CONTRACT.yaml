continuous_loop:
- step: READ
  owner: Existing WORK/executor re-entry
  rule: Current authority/unfinished execution/review before new work; use repository not this snapshot.
- step: SELECT
  owner: Existing WORK
  rule: Choose only original incoming-edge-ready candidates; first proposed MVP preparation target MA02-U01. This does not rewrite CURRENT_WORK or activate a new queue item. Selection is non-authority.
    If no valid Grant or prerequisites, prepare request/STOP rather than CODE.
- step: CODE
  owner: Exact qualified Executor
  rule: Only after original lifecycle PASS_READY_TO_INVOKE_EXECUTOR and actual invocation. One global Writer. No product
    code by this package.
- step: TEST
  owner: Executor
  rule: Run exact targeted tests first; relevant integration/regression and mandatory final tests preserved. Save actual
    command/evidence before summarizing.
- step: FIX
  owner: Executor within original finite Grant
  rule: Failed relevant oracle -> analyze root -> minimum same-scope correction only within the stricter applicable policy and exact Grant cap. Preserve AGENTS Level3A maximum two scope-internal cycles per failing test when applicable; this is not a new per-Unit correction budget. Never inherit a consumed or unrelated WO review-fix budget.
- step: RECORD
  owner: Executor then existing WORK
  rule: Freeze diff/body/hash/logs/failures/cost/remaining issues; qualified independent review; mechanical Intake !=
    semantic acceptance; release Writer only with durable completion/STOP procedure.
- step: NEXT
  owner: Existing WORK
  rule: Update authoritative current/queue only if permitted; select next candidate. Preserve one WorkPackage per autonomous
    run and no automatic dispatch/next-package authority. Stage continuity cannot consume nonexistent grants.
resume_contract:
  same_invoked_execution: Fresh exact current/source/scope/Grant/dispatch/invocation/Writer/provider revalidation; no
    new execution/reservation/dispatch/budget; missing historical proof STOP_NO_BACKFILL.
  executor_switch: Durable checkpoint + no concurrent writer + new qualified route/exact legal authorization; no same-execution
    multi-executor or consumed redispatch.

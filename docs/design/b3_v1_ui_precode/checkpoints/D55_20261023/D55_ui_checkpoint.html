<script>
(()=>{'use strict';const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));const initial=[{id:'overview',title:'投資組合概要',x:0,y:0,w:3,h:1,subject:'portfolio'},{id:'capital',title:'資金 · 可用與已配置',x:3,y:0,w:3,h:1,subject:'capital'},{id:'strategy',title:'策略績效',x:6,y:0,w:3,h:1,subject:'portfolio'},{id:'news',title:'持有標的新聞',x:9,y:0,w:3,h:1,subject:'news'},{id:'trend',title:'組合表現 · 分類／策略',x:0,y:1,w:8,h:2,subject:'portfolio'},{id:'allocation',title:'資產分布',x:8,y:1,w:4,h:2,subject:'portfolio'},{id:'assets',title:'分類資產 · 金額／投報',x:0,y:3,w:6,h:2,subject:'portfolio'},{id:'holdings',title:'持有資產清單',x:6,y:3,w:6,h:2,subject:'portfolio'}];let layout=clone(initial),icons={portfolio:'▦',market:'⌁',lab:'⚗',schedule:'◷',engineering:'☷'},railLinks={portfolio:['總覽 · UI01','資產配置 · UI08'],market:['市場商品 · UI03','圖表 · UI02'],lab:['研究 · UI05','策略編輯 · UI04'],schedule:['研究排程 · UI05（候選）'],engineering:['Automation · UI16']},assets=[['股票','833,000','+1.7%'],['債券 ETF','1,006,250','+2.1%'],['長期 ETF','490,000','+5.1%'],['台灣期貨','630,000','-3.2%'],['現金','378,000','+0.0%'],['其他','157,500','UNKNOWN'],['債券','310,000','+0.4%'],['海外股票','283,000','-0.7%']];let assetTab='總覽',assetPage=0,holdingPage=0,layoutDraft=null,moduleDraft=null,activeCell=null,selectedModule=null,dialogMode='',dialogReturn='settings',settingPage='palette',editIcons=null,selectedGroup='portfolio',mouseIndex=null;const units={KPI:'主金額與變化',line:'近期折線',bar:'分類長條',list:'固定清單',quality:'資料品質',text:'來源描述'},subjects={portfolio:'投資組合',capital:'目前資金',strategy:'策略績效',asset:'資產類別',market:'市場商品'};let definitions=[{id:'custom-capital',name:'目前資金雙格',subject:'capital',cols:2,rows:1,slots:[{x:0,y:0,w:1,h:1,kind:'KPI'},{x:1,y:0,w:1,h:1,kind:'line'}]}];let lastDialog='';const currencies=s=>$('stateSel').value==='UNKNOWN'?'—':s;function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2300)}function sparkline(values,color='#67bffa',klass='spark'){const min=Math.min(...values),max=Math.max(...values),dif=max-min||1;const points=values.map((v,i)=>`${(i*100/(values.length-1)).toFixed(1)},${(41-(v-min)/dif*32).toFixed(1)}`).join(' ');return `<svg class="${klass}" viewBox="0 0 100 46" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`}function pager(id,cur,total){return total>1?`<span class="pager"><button class="small" data-pg="${id}:prev" aria-label="上一頁">‹</button><span>${cur+1}/${total}</span><button class="small" data-pg="${id}:next" aria-label="下一頁">›</button></span>`:''}function head(m){return `<div class="card-head"><span>${m.title}</span>${m.id==='assets'?pager('assets',assetPage,Math.ceil((assetTab==='總覽'?assets:assets.filter(x=>x[0]===assetTab)).length/6)):m.id==='holdings'?pager('holdings',holdingPage,2):''}</div>`}function fieldCap(label,value,change){return `<div class="metric-line"><span class="minor">${label}</span><strong class="${change.startsWith('-')?'loss':'change'}">${change}</strong></div><div class="big">${currencies(value)}</div>`}const trendPeriods=['25-11','25-12','26-01','26-02','26-03','26-04'];

for(let i=0;i<trendPeriods.length;i++){let cx=58+i*104;strategySeries.forEach((it,j)=>{const diff=i===0?0:it.values[i]-it.values[i-1],y=diff>=0?64-Math.abs(diff)*4:64;const height=Math.abs(diff)*4;r+=`<rect x="${cx+j*15-22}" y="${y}" width="11" height="${height}" rx="1" fill="${it.color}" aria-label="${trendPeriods[i]} ${it.name} ${diff}萬"/>`});r+=`<text x="${cx}" y="110" text-anchor="middle" fill="#aac0d7" font-size="12">${trendPeriods[i]}</text>`}return r+'</svg>'}

ay:flex;justify-content:center;align-items:center;min-height:110px"><div style="width:112px;height:112px;border-radius:50%;background:conic-gradient(#38a7b9 0 26%,#678de2 26% 55%,#b49b5d 55% 71%,#8e6fbe 71% 86%,#3ab490 86% 100%);display:grid;place-items:center"><div style="border-radius:100%;width:62px;height:62px;background:var(--card);display:grid;place-items:center">資產</div></div></div><div class="metric-line"><span>股票 23.9%</span><span>債券 ETF 28.9%</span></div><div class="metric-line"><span>期貨 18.1%</span><span>現金及其他 29.1%</span></div>`;if(m.id==='assets'){const tabs=['總覽','股票','債券 ETF','台灣期貨','長期 ETF','現金','其他'];const d=assetTab==='總覽'?assets:assets.filter(x=>x[0]===assetTab);const pages=Math.max(1,Math.ceil(d.length/6));assetPage=Math.min(assetPage,pages-1);return `<div class="tabs">${tabs.map(t=>`<button data-tab="${t}" class="${assetTab===t?'current':''}">${t}</button>`).join('')}</div><div class="asset-grid">${Array.from({length:6},(_,i)=>{const a=d[assetPage*6+i];return a?`<div class="asset"><b>${a[0]}</b><section><span class="minor">金額／投報</span><strong>${currencies('NT$ '+a[1])}</strong>${sparkline([12+i,15+i,13+i,21+i,23+i,22+i])}<span class="${a[2].startsWith('-')?'loss':'change'}">${a[2]}</span></section></div>`:`<div class="asset placeholder" aria-hidden="true"></div>`}).join('')}</div>`}if(m.id==='holdings'){const d=Array.from({length:8},(_,i)=>['TXF / ETF / Stock '+(i+1),(700000-i*67000).toLocaleString(),`${i%2?'-':'+'}${((i+1)*.6).toFixed(1)}%`]);return `<div class="controlrow"><span class="muted">Portfolio Assets · 六筆固定容量</span><span class="pager">${pager('holdings',holdingPage,2)}</span></div><div class="data-rows">${Array.from({length:6},(_,i)=>{const a=d[holdingPage*6+i];return a?`<div class="data-row"><strong>${a[0]}</strong><span>${currencies('NT$ '+a[1])}</span><span class="${a[2][0]==='-'?'loss':'change'}">${a[2]}</span></div>`:`<div class="data-row empty" aria-hidden="true">　</div>`}).join('')}</div>`}{const d=definitions.find(x=>x.id===m.templateId);if(!d)return `<strong>${m.title}</strong><p class="muted">自訂模組示意</p>`;return `<div style="display:grid;grid-template-columns:repeat(${d.cols},minmax(0,1fr));grid-template-rows:repeat(${d.rows},minmax(0,1fr));gap:5px;flex:1;min-height:0">${d.slots.map((a,i)=>`<div style="grid-column:${a.x+1}/span ${a.w};grid-row:${a.y+1}/span ${a.h};background:#102137;border:1px solid #355d7b;padding:8px;border-radius:6px;min-width:0;min-height:0;overflow:hidden"><div class="minor">${a.field||'示意指標'}（${subjects[d.subject]}）</div>${a.kind==='line'?sparkline([6,8,7,9,11,10,13]):a.kind==='bar'?'<div style="height:22px;background:linear-gradient(90deg,#56b7fa 40%,#284669 40%)"></div>':a.kind==='KPI'?`<strong>${currencies(d.subject==='capital'?'NT$ 82.0萬':'NT$ 3.5M')}</strong>`:a.kind==='quality'?'<span class="minor">Source/Cut：DEMO</span>':'<span class="minor">來源核實後顯示</span>'}</div>`).join('')}</div>`}}function render(){const root=$('dashboard');root.innerHTML=layout.map(m=>`<article class="card" data-card="${m.id}" style="grid-column:${m.x+1}/span ${m.w};grid-row:${m.y+1}/span ${m.h}">${head(m)}<div class="card-body">${body(m)}</div></article>`).join('');root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{assetTab=b.dataset.tab;assetPage=0;render()});root.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const[id,dir]=b.dataset.pg.split(':');if(id==='assets')assetPage=(assetPage+(dir==='next'?1:-1)+Math.max(1,Math.ceil((assetTab==='總覽'?assets:assets.filter(a=>a[0]===assetTab)).length/6)))%Math.max(1,Math.ceil((assetTab==='總覽'?assets:assets.filter(a=>a[0]===assetTab)).length/6));else if(id==='holdings')holdingPage=(holdingPage+(dir==='next'?1:-1)+2)%2;render()});const plot=$('trendPlot');if(plot){plot.onmousemove=e=>{const i=Math.min(5,Math.max(0,Math.floor((e.offsetX/Math.max(1,plot.clientWidth))*6)));const tip=$('trendTip');tip.hidden=false;tip.innerHTML=strategyTooltip(i);tip.style.left=Math.min(plot.clientWidth-115,Math.max(4,e.offsetX+12))+'px'};plot.onmo function d19PlaceCandidates(cards,w,h,x,y,ignore){return !cards.some(c=>c.id!==ignore&&x<c.x+c.w&&x+w>c.x&&y<c.y+c.h&&y+h>c.y)&&(x>=0&&y>=0&&x+w<=12&&y+h<=8);}
function d19Nearest(x,y,w,h,ignore){const list=d19.drafts[d19.page]||[];const valid=[];for(let ry=0;ry<=8-h;ry++)for(let rx=0;rx<=12-w;rx++)if(d19PlaceCandidates(list,w,h,rx,ry,ignore))valid.push({x:rx,y:ry,distance:Math.abs(x-rx)+Math.abs(y-ry)});valid.sort((a,b)=>a.distance-b.distance||Math.abs(a.y-y)-Math.abs(b.y-y)||a.x-b.x);return valid[0]||null;}
function d19GridPoint(grid,e,w,h,anchorX=0,anchorY=0){const rect=grid.getBoundingClientRect(),gap=5,stepX=(grid.clientWidth-16-(11*gap))/12+gap,stepY=(grid.clientHeight-16-(7*gap))/8+gap,localX=e.clientX-rect.left-8-anchorX,localY=e.clientY-rect.top-8-anchorY;return {x:Math.max(0,Math.min(12-w,Math.round(localX/stepX))),y:Math.max(0,Math.min(8-h,Math.round(localY/stepY)))};}

function d19GhostUpdate(e,m,grid,ghost,drag=null){const p=d19GridPoint(grid,e,m.w,m.h,drag?.anchorX||0,drag?.anchorY||0),near=d19Nearest(p.x,p.y,m.w,m.h,m.id),gap=5,width=(grid.clientWidth-16-11*gap)/12,height=(grid.clientHeight-16-7*gap)/8;ghost.classList.toggle('bad',!near);const xx=(near||p).x, yy=(near||p).y;ghost.style.left=(8+xx*(width+gap))+'px';ghost.style.top=(8+yy*(height+gap))+'px';ghost.style.width=(m.w*width+(m.w-1)*gap)+'px';ghost.style.height=(m.h*height+(m.h-1)*gap)+'px';ghost.textContent=near?`${m.w}×${m.h} · 吸附位置 ${xx+1},${yy+1}`:'無合法位置';}
function d19RenderInspector(){const el=document.querySelector('#d19Inspector');const group=d19.group;const candidates=d19Candidates();if(!candidates.find(c=>c.id===d19.candidate))d19.candidate=candidates[0]?.id||'';let choice=candidates.find(c=>c.id===d19.candidate);el.innerHTML=`<div class="d19-paneltitle">A／B／C 模組選取</div><div class="d19-stack"><label>A　功能類別${group==='custom'?`<select id="d19CategoryChoice">${d19Option(Object.entries(d18GroupNames).filter(([key])=>key!=='custom'),d19.categoryChoice)}</select>`:`<input readonly value="${d19E(d18GroupNames[d19.group]||'自定義頁面')}">`}</label><label>B　呈現類型<select id="d19Kind"><option value="">選擇呈現方式（不限）</option>${d19Option(d19Kinds,d19.kind)}</select></label><label>C　可用模組<select id="d19ModuleChoice">${d19Option(candidates.map(c=>[c.id,c.name]),d19.candidate)}</select></label><section class="d19-preview" id="d19ChoicePreview">${choice?`<strong>${d19E(choice.name)}</strong><div class="d19-card-preview">${d20ModuleVisual(choice.id,choice.kind)}</div><span class="d19-muted">${choice.w}×${choice.h} · ${d19E(choice.subject)} · 示意</span>`:'沒有符合候選，請選其他類型'}</section><button id="d19Add" class="d19-primary" ${!choice?'disabled':''}>＋ 加入模組至工作區</button><button id="d19NewModule">＋ 新建自訂模組</button></div><div class="d19-rowsep d19-muted">A 在一般頁面鎖定相同功能類別；只有「自定義頁面」可跨類別選擇。</div>`;

function d19StartModule(id=null){let existing=d19.modules.find(v=>v.id===id);d19.mod=existing?d19Copy(existing):{id:d19Unique(),name:'新模組',category:d19.group==='custom'?d19.categoryChoice:d19.group,subject:d19.group==='market'?'market':d19.group==='lab'?'strategy':'capital',cols:2,rows:1,slots:[]};d19.modOriginal=existing?d19Copy(existing):null;d19.selectedSlot=0;d19.layer='module';d19.note='② 此處先決定模組的格線；按中央「＋」再設定每一格資訊；儲存後由工作台組合模組';d19Render();}
function d19RenderModule(){const m=d19.mod||{id:d19Unique(),name:'新模組',category:'portfolio',subject:'capital',cols:2,rows:1,slots:[]};d19.mod=m;const root=document.querySelector('#d19Body');root.innerHTML='<aside class="d19-side" id="d19ModLeft"></aside><section class="d19-center" id="d19ModCenter"></section><aside class="d19-side d19-right" id="d19ModRight"></aside>';const cat=d19SubjectMap[m.subject]||d19SubjectMap.capital;const l=root.querySelector('#d19ModLeft');l.innerHTML=`<div class="d19-paneltitle">目前模組／功能分類</div>${!d19.modOriginal&&m.slots.length===0?`<label style="margin-bottom:9px">資料細類／主體<select id="d19ModSubject">${d19Option(Object.entries(d19SubjectMap).filter(([_,v])=>d19.group==='custom'||v.category===d19SubjectMap[m.subject]?.category).map(([key,value])=>[key,value.subcategory||value.category||key]),m.subject)}</select></label>`:''}<input id="d19ModSearch" placeholder="搜尋模組"/><div id="d19ModList" class="d19-stack"></div><button id="d19New" class="d19-primary" style="margin-top:10px;width:100%">＋ 新建模組</button>`;if(l.querySelector('#d19ModSubject'))l.querySelector('#d19ModSubject').onchange=e=>{m.subject=e.target.value;d19RenderModule();};l.querySelector('#d19ModSearch').oninput=()=>d19PaintModuleList();l.querySelector('#d19New').onclick=()=>d19StartModule();d19PaintModuleList();
 const center=root.querySelector('#d19ModCenter');center.innerHTML=`<div class="d19-toolbar"><strong>${d19E(m.name)}</strong><span class="d19-muted">${m.cols}×${m.rows} · 同一主體</span></div><div class="d19-segment"><label>橫向格數<select id="d19ModCols">${d19Option([1,2,3,4,5,6,8,12].map(n=>[String(n),String(n)]),String(m.cols))}</select></label><label>垂直格數<select id="d19ModRows">${d19Option([1,2,3,4,5,6].map(n=>[String(n),String(n)]),String(m.rows))}</select></label></div><div id="d19ModuleGrid" class="d19-modulegrid" style="grid-template-columns:repeat(${m.cols},minmax(0,1fr));grid-template-rows:repeat(${m.rows},minmax(70px,1fr));margin-top:12px"></div><p class="d19-muted">先決定模組的橫／直格數；按空格的「＋」直接建立資訊模組，點已建立的資訊格可直接修改。右側即時預覽整個模組。</p>`;center.querySelector('#d19ModCols').onchange=e=>d19ResizeModule(+e.target.value,m.rows);center.querySelector('#d19ModRows').onchange=e=>d19ResizeModule(m.cols,+e.target.value);d19PaintModuleGrid();

function d19PaintModuleList(){const el=document.querySelector('#d19ModList');if(!el)return;const q=(document.querySelector('#d19ModSearch')?.value||'').toLowerCase();const list=d19.modules.filter(m=>m.name.toLowerCase().includes(q));el.innerHTML=['<strong class="d19-muted">已存模組</strong>',...list.map(m=>`<div class="d19-light"><button data-d19-mod="${d19E(m.id)}">${d19E(m.name)}</button><div class="d19-muted">${d19E(d19SubjectMap[m.subject]?.subcategory||m.subject)} · ${m.cols}×${m.rows}</div><button data-d19-copy="${d19E(m.id)}">複製</button><button data-d19-del="${d19E(m.id)}">刪除</button></div>`)].join('');el.querySelectorAll('[data-d19-mod]').forEach(b=>b.onclick=()=>d19StartModule(b.dataset.d19Mod));el.querySelectorAll('[data-d19-copy]').forEach(b=>b.onclick=()=>{const old=d19.modules.find(m=>m.id===b.dataset.d19Copy);if(!old)return;const n=d19Copy(old);n.id=d19Unique();n.name=old.name+'（副本）';d19.modules.push(n);d19StartModule(n.id);});el.querySelectorAll('[data-d19-del]').forEach(b=>b.onclick=()=>d19DeleteModule(b.dataset.d19Del));}

function d19InfoSample(s){
 const unit=s.unit||'TWD',digits=Math.min(3,Math.max(0,Number(s.precision)||0));
 const value=unit==='pct'?(1.8).toFixed(digits)+'%':unit==='point'?(125.6).toFixed(digits)+' 點':unit==='count'?(148).toFixed(digits)+' 筆':unit==='NTD萬'?(82).toFixed(digits)+' 萬':'NT$ '+(820000).toFixed(digits);
 const size={small:'.9em',medium:'1.35em',large:'1.9em'}[s.valueSize]||'1.35em';
 const prefix=s.showLabel!==false?'<span class="d19-muted">'+d19E(s.field||'受控欄位')+'</span>':'';

 if(s.sourceType==='feature')return '<div class="d19-stack"><strong style="font-size:'+size+'">功能連結</strong><span>'+d19E(s.featureId||'UI01')+'　'+d19E(d19UIList.find(z=>z[0]===s.featureId)?.[1]||'未選功能')+'</span><span class="d19-muted">僅示意，不實際導航</span></div>';
 if(s.kind==='line'||s.kind==='area')return '<div class="d19-stack">'+prefix+'<svg viewBox="0 0 170 50" preserveAspectRatio="none" role="img" aria-label="模擬'+(s.kind==='area'?'面積圖':'折線圖')+'"><path d="M0 37 L28 28 L56 34 L84 14 L112 22 L140 7 L170 13'+(s.kind==='area'?' L170 50 L0 50 Z':'')+'" fill="'+(s.kind==='area'?'#315d87':'none')+'" stroke="#6ac7ff" stroke-width="2.4"/></svg>'+legend+'</div>';
 if(s.kind==='bar')return '<div class="d19-stack">'+prefix+'<div style="height:42px;display:flex;align-items:end;gap:4px">'+[12,23,34,19,40,27].map(h=>'<span style="height:'+h+'px;background:#6abddd;flex:1"></span>').join('')+'</div>'+legend+'</div>';
 if(s.kind==='table')return '<div class="d19-stack">'+prefix+'<span>區間　　　指標</span><span>DEMO-01　 '+d19E(value)+'</span>'+legend+'</div>';
 if(s.kind==='text')return '<div class="d19-stack">'+prefix+'<span>資料來源與品質狀態需後端驗證</span>'+legend+'</div>';
 return '<div class="d19-stack">'+prefix+'<strong style="font-size:'+size+';word-break:break-word">'+d19E(value)+'</strong><span class="d19-success">合成示意</span>'+legend+'</div>';
}
function d19SaveModule(mode){const m=d19.mod,original=d19.modOriginal;if(!m.name.trim()){document.querySelector('#d19SaveWarning').textContent='請輸入模組名稱';return;}if(m.slots.length===0){document.querySelector('#d19SaveWarning').textContent='至少建立一個資訊區塊';return;}

/* D1-R14 keyboard recovery: Esc closes transient rail/nav/search surfaces; modals own Esc separately. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const activeEditor=document.getElementById('d19Shade');
  const activeSettings=document.getElementById('shade');

  let closed=false;

// A single cached set of title metrics. Color changes only repaint the palette;
// typography or wheel width changes are the only causes to refit the title.
let d47TitleMetrics=null;
function d47FitWheelHeading(force=false){
 const title=document.querySelector('#d19Shade #settingPage .d22-color-left>h3');
 const wheel=document.querySelector('#d19Shade #settingPage .d22-color-left .d22-wheel');
 const studio=document.querySelector('#d19Shade #settingPage .d22-color-studio');
 if(!title||!wheel||!studio)return;
 const width=Math.round(wheel.getBoundingClientRect().width*10)/10;
 if(width<50)return;
 const label='Color Wheel Tool';
 if(title.textContent.trim()!==label)title.textContent=label;
 const computed=getComputedStyle(title),font=computed.fontFamily,weight=computed.fontWeight;
 const cfg=d39Draft?.globalHeading||{};
 const key=[width,font,weight,cfg.size??cfg.enSize,cfg.en,cfg.zh,label].join('|');
 if(force||!d47TitleMetrics||d47TitleMetrics.key!==key){
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)return;
  const maxSize=Math.max(16,Math.min(88,Number(cfg.size??cfg.enSize??52)+18));
  const target=width-3;let lo=10,hi=maxSize;
  for(let j=0;j<18;j++){
   const mid=(lo+hi)/2;ctx.font=weight+' '+mid+'px '+font;
   if(ctx.measureText(label).width<=target)lo=mid;else hi=mid;
  }
  const fontSize=Math.max(10,lo-.3);
  ctx.font=weight+' '+fontSize+'px '+font;
  const natural=ctx.measureText(label).width;
  const spacing=Math.max(0,Math.min(16,(target-natural)/Math.max(1,label.length-1)));
  d47TitleMetrics={key,width:width+'px',size:fontSize.toFixed(3)+'px',spacing:spacing.toFixed(3)+'px'};
 }
 studio.style.setProperty('--d47-title-width',d47TitleMetrics.width);
 studio.style.setProperty('--d47-title-size',d47TitleMetrics.size);
 studio.style.setProperty('--d47-title-spacing',d47TitleMetrics.spacing);
 // Earlier versions leave inline !important styles on the heading. Override them
 // as a coherent set, otherwise the heading can wrap despite our grid CSS.
 title.style.setProperty('width',d47TitleMetrics.width,'important');
 title.style.setProperty('max-width',d47TitleMetrics.width,'important');
 title.style.setProperty('font-size',d47TitleMetrics.size,'important');
 title.style.setProperty('letter-spacing',d47TitleMetrics.spacing,'important');
 title.style.setProperty('white-space','nowrap','important');
 title.style.setProperty('word-break','keep-all','important');
 title.style.setProperty('display','block','important');
 title.style.setProperty('overflow','hidden','important');
}

function allocationBody(m){const sums=assetDefs.map(a=>a.amount*pfFactor(m)),tot=sums.reduce((a,b)=>a+b,0);let acc=0;const colors=['var(--accent)','#64a4d6','#f3ba72','#9b8de3','#76baab','#bf95c1'];const circles=assetDefs.map((a,i)=>{let pct=sums[i]/tot*100,len=pct*3.3,off=acc*3.3;acc+=pct;return `<circle cx="170" cy="103" r="52" fill="none" stroke="${colors[i]}" stroke-width="22" transform="rotate(-90 170 103)" stroke-dasharray="${len} ${330-len}" stroke-dashoffset="${-off}"/>`}).join('');return `<div class="caps">${esc(activePf(m).name)} · 六類資產</div><div class="alloc-content"><svg viewBox="0 0 340 205" class="donut-svg" aria-label="資產類別分布的占比與金額">${valid()?circles:''}<text x="170" y="103" font-size="15" text-anchor="middle" fill="var(--text)">${valid()?'100%':'—'}</text>${assetDefs.map((a,i)=>{let x=i%2===0?30:255,y=23+Math.floor(i/2)*67;return `<text x="${x}" y="${y}" font-size="10" fill="var(--muted)">${esc(a.name)}</text><text x="${x}" y="${y+14}" font-size="10" fill="var(--text)">${valid()?((sums[i]/tot*100).toFixed(1)+'% · '+Math.round(sums[i]/10000)+'萬'):'—'}</text>`}).join('')}</svg><div class="detail-tabs"><button class="${!state.allocationTab?'active':''}" data-allocation-tab="0">總覽</button><button class="${state.allocationTab===1?'active':''}" data-allocation-tab="1">股票</button><button class="${state.allocationTab===2?'active':''}" data-allocation-tab="2">債券</button><button class="${state.allocationTab===3?'active':''}" data-allocation-tab="3">其他</button></div><div class="metricline"><span>${['總體資產','股票分類','債券分類','其他類別'][state.allocationTab||0]}</span><strong>${money(state.allocationTab?((state.allocationTab===1?833000:state.allocationTab===2?1006250:870750)*pfFactor(m)):tot)}</strong></div></div>`}
function categories(){return[['all','總覽'],...assetDefs.map(a=>[a.id,a.name])]}

function assetsBody(m){const unsorted=state.asset==='all'?assetDefs:assetDefs.filter(a=>a.id===state.asset);const rows=[...unsorted].sort((a,b)=>{let v=state.sort==='roi'?((a.roi??-999)-(b.roi??-999)):(a.amount-b.amount);return(state.sortDir==='desc'?-1:1)*v});const page=clamp(state.assetPage,0,Math.max(0,Math.ceil(rows.length/6)-1));const shown=rows.slice(page*6,page*6+6);return `${tabsHTML(state.asset,'asset')}<div class="asset-toolbar"><span class="caps">資產類別 · 同尺寸六格模板</span><div><button data-sort="amount">金額 ${state.sort==='amount'?(state.sortDir==='desc'?'↓':'↑'):'↕'}</button><button data-sort="roi">投報 ${state.sort==='roi'?(state.sortDir==='desc'?'↓':'↑'):'↕'}</button></div></div><div class="asset-tiles">${Array.from({length:6},(_,i)=>{const a=shown[i];if(!a)return '<div class="asset-tile tileempty">—</div>';let v=a.amount*pfFactor(m);return `<div class="asset-tile"><div class="strip">${esc(a.name)}</div><div class="tilecontent"><div><div class="caps">金額 · 示例</div><strong>${money(v)}</strong><div class="${dotCls(a.roi)}" style="margin-top:8px;font-size:11px">${valid()?labelReturn(a.roi):'—'}</div></div>${valid()?lineSVG(sparkArr(i*3+pfFactor(m))):'<div class="muted">—</div>'}</div></div>`}).join('')}</div>${pageHTML(page,rows.length,6,'assets')}`}
function holdingsBody(m){const a=state.asset==='all'?holdings:holdings.filter(x=>x.group===state.asset);const sorted=[...a].sort((x,y)=>{let v=state.sort==='roi'?((x.roi??-999)-(y.roi??-999)):(x.amount-y.amount);return(state.sortDir==='desc'?-1:1)*v});const page=clamp(state.holdPage,0,Math.max(0,Math.ceil(sorted.length/6)-1)),shown=sorted.slice(page*6,page*6+6);return `${tabsHTML(state.asset,'hold')}<div class="asset-toolbar"><span class="caps">持有資產清單 · 六筆固定容量</span><div><button data-sort="amount">金額 ${state.sort==='amount'?(state.sortDir==='desc'?'↓':'↑'):'↕'}</button><button data-sort="roi">投報 ${state.sort==='roi'?(state.sortDir==='desc'?'↓':'↑'):'↕'}</button></div></div><div class="holdgrid">${Array.from({length:6},(_,i)=>{let z=shown[i];return z?`<div class="holdrow"><span>${esc(z.ticker)}</span><span>${esc(assetDefs.find(x=>x.id===z.group)?.name)}</span><span>${money(z.amount*pfFactor(m))}</span><span class="${dotCls(z.roi)}">${valid()?labelReturn(z.roi):'—'}</span></div>`:`<div class="holdrow" aria-label="保留空位"><span>—</span><span></span><span></span><span></span></div>`}).join('')}</div>${pageHTML(page,sorted.length,6,'holdings')}`}
function customBody(m){const d=state.userModules.find(x=>x.id===m.def);if(!d)return '<div class="empty-safe">找不到模組定義</div>';let data=d.subject;return `<div class="caps">單一資料主體：${esc(data)} · 資料僅示意</div><div class="preview-mini" style="--cols:${d.cols};--rows:${d.rows}">${d.slots.map((s,i)=>`<div style="--x:${s.x+1};--y:${s.y+1};--w:${s.w};--h:${s.h}"><span class="caps">${esc(s.metric||'欄位')}</span>${s.presentation==='line'?lineSVG(sparkArr(i+3)):s.presentation==='number'?`<div class="kpi">${money(825000*pfFactor(m))}</div>`:s.presentation==='bar'?`<div class="meter"><b style="width:68%"></b></div>`:`<strong>${esc(s.subtype||s.presentation||'待設定')}</strong>`}</div>`).join('')}</div><div class="hint">顯示資料需由正式 Producer／DTO 實際綁定</div>`}

div><div class="settingline"><label>＋匯入 PNG／WebP 圖示（示意本機）<input type="file" id="iconFile" accept="image/png,image/webp" style="width:100%;margin-top:7px"></label><small class="muted">不允許原始 SVG／外部程式碼；限 150KB。正式伺服器上傳需另行安全審核。</small></div></div></div>`}

function lum(hex){let a=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function fgFor(hex){return lum(hex)>.22?'#102030':'#f6fbff'}
function contrast(a,b){const aa=lum(a),bb=lum(b);return (Math.max(aa,bb)+.05)/(Math.min(aa,bb)+.05)}
function designContrastIssues(){const c=state.colors;return [['主文字／模組',c.text,c.card],['主文字／導覽',c.text,c.nav],['輔助文字／背景',c.muted,c.bg]].filter(([name,a,b])=>contrast(a,b)<4.5)}
function applyTheme(){for(const [k,v] of Object.entries(state.colors)){document.documentElement.style.setProperty('--'+k,v)}document.documentElement.style.setProperty('--on-accent',fgFor(state.colors.accent));document.documentElement.style.setProperty('--font-scale',state.fontScale);document.documentElement.style.setProperty('--unit',`${Math.round(178*state.fontScale)}px`);document.body.dataset.largeFont=String(state.fontScale>=1.5);document.body.dataset.fontScale=String(state.fontScale);document.body.dataset.debug=String(state.debug)}
function themeBody(){return `<div class="inlinegrid"><div class="pane"><h3>色輪及預設組合</h3><div class="color-wheel" id="colorWheel" tabindex="0"><div class="wheelcenter"><strong>色輪</strong></div></div>${Object.keys({...baseThemes,...state.palettes}).map(n=>`<button data-preset="${esc(n)}" style="margin:4px">${esc(n)}</button>`).join('')}<div class="settingline"><label>自訂方案名稱 <input id="themeName" placeholder="例如：暖色交易桌面" value="${esc(state.themeName)}" style="padding:8px"></label><button data-action="themeAdd">＋保存</button><button data-action="themeRemove">−刪除</button></div></div><div class="pane"><h3>各角色色塊</h3><p class="hint">色碼只在懸停及編輯時顯示；支援輸入 #RRGGBB。環境／權限／漲跌色語義獨立。</p><div class="swatch-grid">${Object.entries(state.colors).map(([k,v])=>`<div class="swatch" title="${k}：${v}"><label>${({bg:'背景',nav:'導覽',card:'模組',panel:'面板',surface:'表頭',border:'邊線',text:'文字',muted:'次要文字',accent:'強調色'})[k]||k}</label><input type="color" data-color-pick="${k}" value="${v}"><input class="hex-entry" aria-label="${k} HEX" data-color-hex="${k}" value="${v}" maxlength="7"></div>`).join('')}</div><div class="visual-review" style="margin-top:15px"><strong>對比檢核：</strong>${designContrastIssues().length?'<span class="danger">文字對比不足：'+designContrastIssues().map(x=>x[0]).join('、')+'；禁止套用，請調整前景／背景色</span>':'主要文字／背景對比均達 4.5:1 候選門檻'}。此結果不等於完整 WCAG 驗收。</div></div></div>`}
function displayBody(){return `<div class="pane"><h3>顯示密度與設計輔助資訊</h3><div class="inlinegrid"><label>字體比例<select id="fontRatio"><option value="1" ${state.fontScale===1?'selected':''}>100%</option><option value="1.25" ${state.fontScale===1.25?'selected':''}>125%</option><option value="1.5" ${state.fontScale===1.5?'selected':''}>150%</option><option value="2" ${state.fontScale===2?'selected':''}>200%</option></select></label><label>左側顯示偏好（詳見左下齒輪）<input disabled value="${state.mode==='icon'?'ICON':'自訂'}"></label></div><div class="settingline"><label><input id="debugToggle" type="checkbox" ${state.debug?'checked':''}> 顯示 UI 編號／來源設計註記（預設隱藏）</label></div><div class="settingline">幣別與單位採淡色顯示，但不可在跨幣別交易／風險判讀時造成歧義；SOURCE/CUT/UNKNOWN 不允許隱藏。</div></div>`}
function workspaceBody(){return `<div class="pane"><h3>工作台與模組</h3><p class="muted">工作台：移動／加入／刪除整頁上的模組。模組：編輯同一資料主體的內部 NxM 資訊組合。兩者的儲存／取消互相獨立。</p><button data-action="launchLayout" class="primary">進入工作台版型</button>　<button data-action="launchModule">建立／編輯模組</button>　<button data-action="exportAll">匯出設計配置 JSON</button><div class="visual-review" style="margin-top:17px">個別模組可釘選投資組合；所有未釘選模組預設跟隨主選組合。所有自訂欄位僅綁定同一 DataSubjectRef。</div></div>`}

function rectCollide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

}
function pointerTip(e){const svg=e.target.closest('svg[data-trend]');if(!svg||!valid())return;const m=layout.find(x=>x.id===svg.dataset.trend),pts=trendPoints(m);const rect=svg.getBoundingClientRect(),idx=clamp(Math.round((e.clientX-rect.left)/rect.width*(pts.length-1)),0,pts.length-1);const p=pts[idx],prior=pts[idx-1];const d=(v,b)=>b===undefined?'—':`${v>=b?'+':'−'}${fmt(Math.abs(v-b))}`;const names=['股票','債券','期貨','現金／其他'];const tip=$('tooltip');tip.innerHTML=`<strong>${p.date} · 總額 ${fmt(p.value)}</strong><div>總額較前期 ${d(p.value,prior?.value)}</div>${p.segments.map((n,i)=>`<div>${names[i]} ${fmt(n)} ｜ ${d(n,prior?.segments[i])}</div>`).join('')}<small>DEMO · 此圖不是實際歸因或權威資產數據</small>`;tip.classList.remove('hidden');tip.style.top=clamp(e.clientY+10,10,window.innerHeight-220)+'px';tip.style.left=clamp(e.clientX+12,10,window.innerWidth-250)+'px'}
function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;const color=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*color).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function dragStart(e){const el=e.target.closest('.gridcard,.mregion');if(!el)return;let id=el.dataset.layoutId||el.dataset.regionId;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move'}
function dragOver(e){const cel=e.target.closest('.gridcell,.mcell');if(cel&&state.modal?.type==='layout'||cel&&state.modal?.type==='module'){e.preventDefault();e.dataTransfer.dropEffect='move'}}
function dropHandler(e){const el=e.target.closest('.gridcell,.mcell');if(!el||!state.modal)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain');if(state.modal.type==='layout'&&el.dataset.emptyX!==undefined){moveLayout(id,Number(el.dataset.emptyX),Number(el.dataset.emptyY))}else if(state.modal.type==='module'&&el.dataset.mcellX!==undefined){const d=state.modal,s=d.draft.slots.find(x=>x.id===id);if(!s)return;let c={...s,x:Number(el.dataset.mcellX),y:Number(el.dataset.mcellY)};if(regionFree(c,d.draft.slots,id)){Object.assign(s,c);d.selectedSlot=id;renderModuleBuilder()}else toast('區塊不可重疊；請選擇完整空白範圍')}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){modalDismiss();return}closeFlyout();$('filterPop').classList.add('hidden');return}});
document.addEventListener('click',onDocumentClick);document.addEventListener('change',e=>{if(e.target.id==='qualitySelect'){setStateQuality(e.target.value);return}if(e.target.id==='portfolioSelect'){setMainPf(Number(e.target.value));return}if(e.target.id==='periodSelect'){state.period=e.target.value;renderDashboard();return}if(e.target.id==='assetSelect'){state.asset=e.target.value;state.assetPage=state.holdPage=0;renderDashboard();return}modalChanged(e)});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){let term=e.target.value.trim().toLowerCase();if(!term)return;const found=featurePages.find(p=>(p[0]+' '+p[1]).toLowerCase().includes(term));if(found)e.target.title=`匹配：${found[0]} ${found[1]} ${found[3]}`;return}if(e.target.id==='quickSearch'&&state.modal?.type==='quick'){state.modal.draft.search=e.target.value;const val=e.target.value;renderQuick();$('quickSearch').value=val;$('quickSearch').focus();return}if(e.target.id==='layoutFind'&&state.modal?.type==='layout'){$('layoutCatalog').innerHTML=layoutCatalogHTML(e.target.value);return}});
document.addEventListener('pointermove',pointerTip);document.addEventListener('pointerleave',e=>{if(e.target.closest?.('svg[data-trend]'))$('tooltip').classList.add('hidden')},true);
document.addEventListener('dragstart',dragStart);document.addEventListener('dragover',dragOver);document.addEventListener('drop',dropHandler);
document.addEventListener('click',e=>{if(e.target.id==='colorWheel'){const r=e.target.getBoundingClientRect(),deg=(Math.atan2(e.clientY-(r.y+r.height/2),e.clientX-(r.x+r.width/2))*180/Math.PI+450)%360;state.colors.accent=hslToHex(deg,85,65);applyTheme();if(state.modal?.type==='settings')renderSettings()}});
// No external scripts, network, broker calls or product data services.
state.modal=null;renderNav();globalRender();
})();
</script></body></html>

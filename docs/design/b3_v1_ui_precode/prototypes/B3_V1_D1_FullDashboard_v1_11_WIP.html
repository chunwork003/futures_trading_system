function d19RenderNav(){const el=document.querySelector('#d19Nav');el.innerHTML='<div class="d19-paneltitle">頁面／功能類別</div><p class="d19-muted">勾選代表同類頁面共用版型格線，資料綁定仍各自查證。</p>'+Object.entries(d18CatToPages).map(([g,keys])=>`<section class="d19-branch"><button class="d19-branchbtn" data-d19-cat="${g}"><span>${d19E(d18GroupNames[g])}</span><span>${d19.catOpen[g]?'－':'＋'}</span></button>${d19.catOpen[g]?`<div class="d19-pages">${g!=='custom'?`<label class="d19-catbox"><input type="checkbox" data-d19-shared="${g}" ${d19.shared[g]?'checked':''}> 統一模板（配置格線）</label>`:''}${keys.map(k=>`<div class="d19-pagerow"><button class="${d19.page===k?'d19-active':''}" data-d19-page="${k}">${d19E(d18PageName(k))}</button>${g!=='custom'?`<select data-d19-pref="${k}" ${d19.shared[g]?'disabled':''}>${d19Option([['category','類別預設'],['personal','自製版型']],d19.pref[k]||'category')}</select>`:''}</div>`).join('')}</div>`:''}</section>`).join('');el.querySelectorAll('[data-d19-cat]').forEach(b=>b.onclick=()=>{d19.catOpen[b.dataset.d19Cat]=!d19.catOpen[b.dataset.d19Cat];d19RenderNav();});el.querySelectorAll('[data-d19-shared]').forEach(b=>b.onchange=()=>{d19.shared[b.dataset.d19Shared]=b.checked;d19RenderNav();});el.querySelectorAll('[data-d19-pref]').forEach(b=>b.onchange=()=>d19.pref[b.dataset.d19Pref]=b.value);el.querySelectorAll('[data-d19-page]').forEach(b=>b.onclick=()=>{d19.page=b.dataset.d19Page;d19.group=d19PageGroup(d19.page);d19.selectedId=null;d19.kind='';d19.categoryChoice=d19.group==='custom'?'portfolio':d19.group;d19RenderWorkspace();});}
function d19Candidates(){const group=d19.group,all=[...Object.entries(d18ModuleNames).map(([id,name])=>({id,name,subject:(initial.find(x=>x.id===id)?.subject)||'portfolio',kind:d18TypeOf[id]||'composite',category:d18CategoryOfModule[id]||'portfolio',w:initial.find(x=>x.id===id)?.w||3,h:initial.find(x=>x.id===id)?.h||1})),...d19.modules.map(m=>({id:m.id,name:m.name,subject:m.subject,kind:'composite',category:(m.category||'portfolio'),w:m.cols||3,h:m.rows||1,custom:true}))];return all.filter(x=>(group==='custom'?x.category===d19.categoryChoice:x.category===group)&&(!d19.kind||x.kind===d19.kind));}
function d19CardName(x){return d19.modules.find(z=>z.id===x.templateId)?.name||d18ModuleNames[x.templateId]||x.title||'自訂模組';}
function d19DrawPreview(type){if(type==='chart')return '<div class="d19-mini-line" aria-label="示意折線圖"></div>';if(type==='kpi')return '<div class="d19-kpi">NT$ 82.0萬</div><span class="d19-small">+1.8% · DEMO</span>';if(type==='compare')return '<div style="display:flex;gap:3px"><div style="height:12px;width:42%;background:#4da3ce"></div><div style="height:12px;width:32%;background:#dbac6c"></div></div>';if(type==='table')return '<span style="font-size:10px">資產 A　　金額</span><hr style="border-color:#54708a"><span style="font-size:10px">資產 B　　投報</span>';if(type==='list')return '<span>• 持倉 A</span><span>• 持倉 B</span>';if(type==='text')return '<span class="d19-small">來源／摘要候選</span>';return '<span class="d19-small">指標＋圖表＋列表</span>'}
function d19CardKind(id){return d18TypeOf[id]||'composite'}
function d19PlaceCandidates(cards,w,h,x,y,ignore){return !cards.some(c=>c.id!==ignore&&x<c.x+c.w&&x+w>c.x&&y<c.y+c.h&&y+h>c.y)&&(x>=0&&y>=0&&x+w<=12&&y+h<=8);}
function d19Nearest(x,y,w,h,ignore){const list=d19.drafts[d19.page]||[];const valid=[];for(let ry=0;ry<=8-h;ry++)for(let rx=0;rx<=12-w;rx++)if(d19PlaceCandidates(list,w,h,rx,ry,ignore))valid.push({x:rx,y:ry,distance:Math.abs(x-rx)+Math.abs(y-ry)});valid.sort((a,b)=>a.distance-b.distance||Math.abs(a.y-y)-Math.abs(b.y-y)||a.x-b.x);return valid[0]||null;}
function d19GridPoint(grid,e,w,h){const rect=grid.getBoundingClientRect(),gap=5,step=(grid.clientWidth-16-(11*gap))/12+gap,localX=e.clientX-rect.left-8,localY=e.clientY-rect.top-8;return {x:Math.max(0,Math.min(12-w,Math.round((localX-w*step/2)/step))),y:Math.max(0,Math.min(8-h,Math.round((localY-h*67/2)/67)))};}
function d19RenderCanvas(){const el=document.querySelector('#d19Canvas');const list=d19.drafts[d19.page]||[];el.innerHTML=`<div class="d19-toolbar"><strong>${d19E(d18PageName(d19.page))}</strong><span class="d19-muted">12 欄 × 8 列 · 拖曳整個占用範圍</span></div><div id="d19Grid" class="d19-grid"><div id="d19Ghost" class="d19-ghost"></div>${list.map(m=>{const name=d19CardName(m),kind=d19CardKind(m.templateId||m.id),preview=d19DrawPreview(kind);return `<article class="d19-card ${m.id===d19.selectedId?'d19-selected':''}" data-d19-card="${d19E(m.id)}" style="grid-column:${m.x+1}/span ${m.w};grid-row:${m.y+1}/span ${m.h}"><div class="d19-cardhead"><span>${d19E(name)}</span><button title="移除模組" data-d19-remove="${d19E(m.id)}">－</button></div><div class="d19-card-preview"><span class="d19-typetag">${m.w}×${m.h} · ${d19E(d19Kinds.find(x=>x[0]===kind)?.[1]||'綜合')}</span>${preview}</div></article>`}).join('')}</div><div class="d19-rowsep d19-muted">空格無需顯示＋；請在右側選 A／B／C，按「＋加入模組」自動尋找合法位置。拖動遇到已占用範圍，預覽會吸附至最近合法位置。</div>`;
 const grid=document.querySelector('#d19Grid');const ghost=document.querySelector('#d19Ghost');el.querySelectorAll('[data-d19-remove]').forEach(x=>x.onclick=e=>{e.stopPropagation();const id=x.dataset.d19Remove;d19.drafts[d19.page]=list.filter(m=>m.id!==id);if(id===d19.selectedId)d19.selectedId=null;d19RenderCanvas();});
 el.querySelectorAll('[data-d19-card]').forEach(node=>{let drag=null;node.onpointerdown=e=>{if(e.target.closest('button'))return;let m=(d19.drafts[d19.page]||[]).find(c=>c.id===node.dataset.d19Card);if(!m)return;drag={m,startX:e.clientX,startY:e.clientY};node.setPointerCapture(e.pointerId);d19.selectedId=m.id;node.classList.add('dragging');ghost.style.display='block';d19GhostUpdate(e,m,grid,ghost);};node.onpointermove=e=>{if(drag)d19GhostUpdate(e,drag.m,grid,ghost);};node.onpointerup=e=>{if(!drag)return;const p=d19GridPoint(grid,e,drag.m.w,drag.m.h),near=d19Nearest(p.x,p.y,drag.m.w,drag.m.h,drag.m.id);if(near){drag.m.x=near.x;drag.m.y=near.y;d19.note=`模組已吸附至 (${near.x+1},${near.y+1}) · 草稿`; } else d19.note='沒有合法放置區域，已保留原位置';drag=null;d19RenderCanvas();d19RenderInspector();};node.onpointercancel=()=>{drag=null;d19RenderCanvas();};node.onclick=()=>{d19.selectedId=node.dataset.d19Card;d19RenderInspector();};});}
function d19GhostUpdate(e,m,grid,ghost){const p=d19GridPoint(grid,e,m.w,m.h),near=d19Nearest(p.x,p.y,m.w,m.h,m.id),gap=5,width=(grid.clientWidth-16-11*gap)/12;ghost.classList.toggle('bad',!near);const xx=(near||p).x, yy=(near||p).y;ghost.style.left=(8+xx*(width+gap))+'px';ghost.style.top=(8+yy*67)+'px';ghost.style.width=(m.w*width+(m.w-1)*gap)+'px';ghost.style.height=(m.h*62+(m.h-1)*gap)+'px';ghost.textContent=near?`${m.w}×${m.h} · 吸附位置 ${xx+1},${yy+1}`:'無合法位置';}
function d19RenderInspector(){const group=d19.group;const el=document.querySelector('#d19Inspector');const candidates=d19Candidates();if(!candidates.find(c=>c.id===d19.candidate))d19.candidate=candidates[0]?.id||'';let choice=candidates.find(c=>c.id===d19.candidate);el.innerHTML=`<div class="d19-paneltitle">A／B／C 模組選取</div><div class="d19-stack"><label>A　功能類別${group==='custom'?`<select id="d19CategoryChoice">${d19Option(Object.entries(d18GroupNames).filter(([key])=>key!=='custom'),d19.categoryChoice)}</select>`:`<input readonly value="${d19E(d18GroupNames[d19.group]||'自定義頁面')}">`}</label><label>B　呈現類型<select id="d19Kind"><option value="">選擇呈現方式（不限）</option>${d19Option(d19Kinds,d19.kind)}</select></label><label>C　可用模組<select id="d19ModuleChoice">${d19Option(candidates.map(c=>[c.id,c.name]),d19.candidate)}</select></label><section class="d19-preview" id="d19ChoicePreview">${choice?`<strong>${d19E(choice.name)}</strong><div class="d19-card-preview">${d19DrawPreview(choice.kind)}</div><span class="d19-muted">${choice.w}×${choice.h} · ${d19E(choice.subject)} · 示意</span>`:'沒有符合候選，請選其他類型'}</section><button id="d19Add" class="d19-primary" ${!choice?'disabled':''}>＋ 加入模組至工作區</button><button id="d19NewModule">＋ 新建自訂模組</button></div><div class="d19-rowsep d19-muted">A 在一般頁面鎖定相同功能類別；只有「自定義頁面」可跨類別選擇。</div>`;
 if(group==='custom')el.querySelector('#d19CategoryChoice').onchange=e=>{d19.categoryChoice=e.target.value;d19.candidate='';d19RenderInspector();};el.querySelector('#d19Kind').onchange=e=>{d19.kind=e.target.value;d19RenderInspector();};const sel=el.querySelector('#d19ModuleChoice');sel.onchange=e=>{d19.candidate=e.target.value;d19RenderInspector();};el.querySelector('#d19Add').onclick=()=>{const c=d19Candidates().find(v=>v.id===d19.candidate);if(!c)return;const p=d19Nearest(0,0,c.w,c.h,null);if(!p){d19.note='沒有適合的完整模組範圍，請先移動或移除其它模組';d19Render();return;}const n={id:d19Unique(),title:c.name,x:p.x,y:p.y,w:c.w,h:c.h,subject:c.subject,templateId:c.id};(d19.drafts[d19.page]??=[]).push(n);d19.selectedId=n.id;d19.note=`已在格線 ${p.x+1},${p.y+1} 加入 ${c.name}（草稿）`;d19RenderWorkspace();};el.querySelector('#d19NewModule').onclick=()=>d19StartModule();}
function d19StartModule(id=null){let existing=d19.modules.find(v=>v.id===id);d19.mod=existing?d19Copy(existing):{id:d19Unique(),name:'新模組',category:'portfolio',subject:'capital',cols:2,rows:1,slots:[]};d19.modOriginal=existing?d19Copy(existing):null;d19.selectedSlot=0;d19.layer='module';d19.note='單一模組綁定一個 DataSubjectRef，禁止混用不同帳戶或環境的資料';d19Render();}
function d19RenderModule(){const m=d19.mod||{id:d19Unique(),name:'新模組',category:'portfolio',subject:'capital',cols:2,rows:1,slots:[]};d19.mod=m;const root=document.querySelector('#d19Body');root.innerHTML='<aside class="d19-side" id="d19ModLeft"></aside><section class="d19-center" id="d19ModCenter"></section><aside class="d19-side d19-right" id="d19ModRight"></aside>';const cat=d19SubjectMap[m.subject]||d19SubjectMap.capital;const l=root.querySelector('#d19ModLeft');l.innerHTML=`<div class="d19-paneltitle">目前模組／功能分類</div><input id="d19ModSearch" placeholder="搜尋模組"/><div id="d19ModList" class="d19-stack"></div><button id="d19New" class="d19-primary" style="margin-top:10px;width:100%">＋ 新建模組</button>`;l.querySelector('#d19ModSearch').oninput=()=>d19PaintModuleList();l.querySelector('#d19New').onclick=()=>d19StartModule();d19PaintModuleList();
 const center=root.querySelector('#d19ModCenter');center.innerHTML=`<div class="d19-toolbar"><strong>${d19E(m.name)}</strong><span class="d19-muted">${m.cols}×${m.rows} · 同一主體</span></div><div class="d19-segment"><label>橫向格數<select id="d19ModCols">${d19Option([1,2,3,4,5,6,8,12].map(n=>[String(n),String(n)]),String(m.cols))}</select></label><label>垂直格數<select id="d19ModRows">${d19Option([1,2,3,4,5,6].map(n=>[String(n),String(n)]),String(m.rows))}</select></label></div><div id="d19ModuleGrid" class="d19-modulegrid" style="grid-template-columns:repeat(${m.cols},minmax(0,1fr));grid-template-rows:repeat(${m.rows},minmax(70px,1fr));margin-top:12px"></div><p class="d19-muted">點空格＋新增資訊區塊；點已占區塊開啟右側預覽。資訊的資料來源、軸、聚合、精度在第三層編輯。</p>`;center.querySelector('#d19ModCols').onchange=e=>d19ResizeModule(+e.target.value,m.rows);center.querySelector('#d19ModRows').onchange=e=>d19ResizeModule(m.cols,+e.target.value);d19PaintModuleGrid();
 const slot=m.slots[d19.selectedSlot],right=root.querySelector('#d19ModRight');right.innerHTML=`<div class="d19-paneltitle">模組 A～G 屬性</div><div class="d19-stack"><label>A　大類（來源鎖定）<input readonly value="${d19E(cat.category)}"></label><label>B　細類（來源鎖定）<input readonly value="${d19E(cat.subcategory)}"></label><label>C　模組名稱<input id="d19ModName" value="${d19E(m.name)}" maxlength="70"></label><label>D　呈現類別<input readonly value="${d19E(slot?.present||'綜合（含空格）')}"></label><label>E　資訊模組（編輯中不得跨主體）<input readonly value="${d19E(slot?.field||'尚未建立資訊區塊')}"></label><div class="d19-light"><strong>F　模組預覽</strong><div class="d19-preview" style="margin-top:7px">${slot?d19InfoSample(slot):'<span class="d19-muted">左側格線按＋以新增內容</span>'}</div></div><button id="d19EditSlot" ${!slot?'disabled':''}>進入資訊模組編輯 →</button><div class="d19-rowsep"><strong>G　儲存／新建</strong></div><div class="d19-segment"><button id="d19SaveModule" class="d19-primary">儲存模組</button><button id="d19SaveAs">另存為新模組</button></div><div id="d19SaveWarning" class="d19-error"></div></div>`;right.querySelector('#d19ModName').oninput=e=>m.name=e.target.value;right.querySelector('#d19EditSlot').onclick=()=>d19EditInfo(d19.selectedSlot);right.querySelector('#d19SaveModule').onclick=()=>d19SaveModule('default');right.querySelector('#d19SaveAs').onclick=()=>d19SaveModule('new');}
function d19PaintModuleList(){const el=document.querySelector('#d19ModList');if(!el)return;const q=(document.querySelector('#d19ModSearch')?.value||'').toLowerCase();const list=d19.modules.filter(m=>m.name.toLowerCase().includes(q));el.innerHTML=['<strong class="d19-muted">已存模組</strong>',...list.map(m=>`<div class="d19-light"><button data-d19-mod="${d19E(m.id)}">${d19E(m.name)}</button><div class="d19-muted">${d19E(d19SubjectMap[m.subject]?.subcategory||m.subject)} · ${m.cols}×${m.rows}</div><button data-d19-copy="${d19E(m.id)}">複製</button><button data-d19-del="${d19E(m.id)}">刪除</button></div>`)].join('');el.querySelectorAll('[data-d19-mod]').forEach(b=>b.onclick=()=>d19StartModule(b.dataset.d19Mod));el.querySelectorAll('[data-d19-copy]').forEach(b=>b.onclick=()=>{const old=d19.modules.find(m=>m.id===b.dataset.d19Copy);if(!old)return;const n=d19Copy(old);n.id=d19Unique();n.name=old.name+'（副本）';d19.modules.push(n);d19StartModule(n.id);});el.querySelectorAll('[data-d19-del]').forEach(b=>b.onclick=()=>d19DeleteModule(b.dataset.d19Del));}
function d19DeleteModule(id){const m=d19.modules.find(m=>m.id===id),uses=Object.entries(d19.drafts).filter(([,a])=>a.some(n=>n.templateId===id));if(uses.length){const candidates=d19.modules.filter(x=>x.id!==id&&x.subject===m.subject);if(!candidates.length){d19.note='使用中的模組沒有相同主體替代方案，不能刪除';document.querySelector('#d19Status').textContent=d19.note;return;}const replacement=prompt('模組正在使用，請輸入替代模組 ID（只能相同資料主體）：\n'+candidates.map(x=>x.id+' '+x.name).join('\n'));if(!replacement)return;let other=candidates.find(x=>x.id===replacement.trim());if(!other){alert('替代模組不合法，未刪除');return;}uses.forEach(([,arr])=>arr.filter(x=>x.templateId===id).forEach(x=>{x.templateId=other.id;x.title=other.name}));}if(!confirm('刪除模組 '+m.name+'？'))return;d19.modules=d19.modules.filter(x=>x.id!==id);if(d19.mod?.id===id)d19.mod=null;d19RenderModule();}
function d19ResizeModule(cols,rows){const m=d19.mod;if(m.slots.some(s=>s.x+s.w>cols||s.y+s.h>rows)){d19.note='現有內容區塊超出新的格線大小，請先調整或刪除該區塊';document.querySelector('#d19Status').textContent=d19.note;d19RenderModule();return;}m.cols=cols;m.rows=rows;d19RenderModule();}

function d110SyncSharedGeometry(){
  for(const [group,enabled] of Object.entries(d19.shared||{})){
    if(!enabled || group==='custom')continue;
    const pages=(d18CatToPages[group]||[]).filter(p=>Array.isArray(d19.drafts[p]));
    if(!pages.length)continue;
    const preferred=pages.includes(d19.page)?d19.page:pages.find(k=>d19.drafts[k].length>0);
    if(!preferred)continue;
    const master=d19.drafts[preferred];
    for(const key of pages){
      if(key===preferred)continue;
      const target=d19.drafts[key];
      // Same-number geometry sharing only: no new or cross-page resources are created.
      if(target.length!==master.length)continue;
      const proposal=target.map((card,i)=>({...card,x:master[i].x,y:master[i].y,w:master[i].w,h:master[i].h}));
      if(proposal.every((c,i)=>d19PlaceCandidates(proposal,c.w,c.h,c.x,c.y,c.id)))d19.drafts[key]=proposal;
    }
  }
}
function d110LegalSlot(m,slotId,x,y,w,h){
 if(x<0||y<0||w<1||h<1||x+w>m.cols||y+h>m.rows)return false;
 return !m.slots.some((o,i)=>i!==slotId&&x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y);
}
function d110NearSlot(m,slotId,x,y,w,h){

}

 for(const [k,key] of Object.entries({ui:'--d110-ui-font',title:'--d110-title-font',kpi:'--d110-kpi-font',note:'--d110-note-font'}))r.setProperty(key,Math.max(9,Math.min(38,Number(q[k])||11))+'px');
 document.body.style.fontFamily=`${q.english}, "${q.chinese}", system-ui, sans-serif`;
}
const d110OldPalette=d18PaletteRender;
d18PaletteRender=function(){d110OldPalette();const root=document.getElementById('settingPage');if(!root)return;
 if(!d110FontDraft)d110FontDraft={...d110FontSaved};
 const p=document.createElement('section');p.id='d110FontPanel';p.className='d110-font-panel';
 p.innerHTML=`<strong style="width:100%">版面字體／字形大小（依類別）</strong>
 <label>英文／數字字形<select data-d110-font="english">${[['Arial','Arial'],['Segoe UI','Segoe UI'],['system-ui','系統預設']].map(([v,t])=>`<option value="${v}" ${d110FontDraft.english===v?'selected':''}>${t}</option>`).join('')}</select></label>
 <label>中文字形<select data-d110-font="chinese">${[['Microsoft JhengHei','微軟正黑體'],['Noto Sans TC','Noto Sans TC'],['system-ui','系統預設']].map(([v,t])=>`<option value="${v}" ${d110FontDraft.chinese===v?'selected':''}>${t}</option>`).join('')}</select></label>
 ${[['ui','一般文字',10,18],['title','導覽／卡片標題',11,22],['kpi','主要數值',18,38],['note','輔助說明',9,16]].map(([k,label,min,max])=>`<label>${label}<input type="number" data-d110-font="${k}" min="${min}" max="${max}" value="${d110FontDraft[k]}"></label>`).join('')}
 <p class="muted" style="width:100%">英文 Arial、中文微軟正黑體為預設；這些僅調整視覺，不隱藏資料品質、單位或交易風險訊息。按取消／Esc 還原。</p>`;
 root.append(p);
 p.querySelectorAll('[data-d110-font]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{let k=el.dataset.d110Font,v=el.type==='number'?Number(el.value):el.value;d110FontDraft[k]=v;d110ApplyFonts(d110FontDraft);}));
};

openSettings=function(tab='palette'){if(tab==='palette'&&!d110FontDraft)d110FontDraft={...d110FontSaved};return d110PriorOpenSettings(tab);};

/* Theme-role contrast integrity. Red/green data significance never mapped into theme accent. */
function d110RGB(hex){const m=String(hex).trim().match(/^#([0-9a-f]{6})$/i);if(!m)return null;return [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16));}
function d110Luminance(hex){const rgb=d110RGB(hex);if(!rgb)return null;const q=rgb.map(v=>{let s=v/255;return s<=0.04045?s/12.92:((s+0.055)/1.055)**2.4});return .2126*q[0]+.7152*q[1]+.0722*q[2];}
function d110Contrast(a,b){const x=d110Luminance(a),y=d110Luminance(b);return x==null||y==null?0:(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function d110SyncThemeContrast(){
 const r=document.documentElement.style,c=getComputedStyle(document.documentElement),bg=c.getPropertyValue('--card').trim(),text=c.getPropertyValue('--text').trim(),muted=c.getPropertyValue('--muted').trim(),accent=c.getPropertyValue('--accent').trim();
 const chooseOn=ref=>d110Contrast('#ffffff',ref)>=d110Contrast('#101820',ref)?'#ffffff':'#101820';
 if(d110Contrast(text,bg)<4.5)r.setProperty('--text',chooseOn(bg));
 if(d110Contrast(muted,bg)<3)r.setProperty('--muted',chooseOn(bg));
 r.setProperty('--d110-on-accent',chooseOn(accent));
}
const d110PriorThemeApply=d18ApplyThemeColors;
d18ApplyThemeColors=function(p){d110PriorThemeApply(p);d110SyncThemeContrast();};
const d110PriorPaletteRender=d18PaletteRender;
d18PaletteRender=function(){d110PriorPaletteRender();const root=document.getElementById('settingPage');root?.querySelectorAll('[data-role-color]').forEach(input=>input.addEventListener('change',()=>d110SyncThemeContrast()));};

// ---- D1 v1.11 semantic palette UX / five harmony handles / per-swatch HEX/RGB popover ----
const d111History={};
const d111OriginalPaletteRender=d18PaletteRender;
function d111HexRGB(s){const h=s.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function d111IsHex(s){return /^#[0-9a-fA-F]{6}$/.test(s||'');}
function d111CloseColor(){document.getElementById('d111ColorPop')?.remove();}
function d111ThemeName(){const e=document.getElementById('d18ThemeChoose'),idx=e?+e.value:0;return [...d18ThemePresets,...d18CustomThemes][idx]?.name||'未命名設計色板';}
function d111HueOffsets(mode){switch(mode){case 'complement':return [0,18,180,198,230];case 'triad':return [0,120,240,40,80];case 'square':return [0,90,180,270,45];case 'mono':return [0,0,0,0,0];default:return [0,20,40,310,330];}}
function d111WheelPaint(wheel,hue=205){if(!wheel)return;const active=wheel.closest('.d18-palette')?.querySelector('[data-harmony].active');const offsets=d111HueOffsets(active?.dataset.harmony||'analog');const r=43, deg=(v)=>((v-90)*Math.PI/180),points=offsets.map((a,i)=>{const t=deg((hue+a)%360);return [50+r*Math.cos(t),50+r*Math.sin(t)];});const colors=[...wheel.closest('#settingPage').querySelectorAll('[data-swatch]')].map(n=>getComputedStyle(n).backgroundColor);const parts=points.map(([x,y],i)=>`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${i?3.3:4.6}" fill="${colors[i]||'white'}"></circle>`).join('');let svg=wheel.querySelector('#d111Handles');if(!svg){wheel.insertAdjacentHTML('beforeend','<svg id="d111Handles" class="d111-wheel-handles" viewBox="0 0 100 100" aria-hidden="true"></svg>');svg=wheel.querySelector('#d111Handles');}svg.innerHTML=points.map(([x,y],i)=>{const [x2,y2]=points[(i+1)%points.length];return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}"/>`}).join('')+parts;}
function d111SwatchPop(index,anchor){d111CloseColor();const active=document.getElementById('d18ActiveHex');const current=active?.value?.toUpperCase()||'#102034';const pop=document.createElement('div');pop.id='d111ColorPop';pop.className='d111-swatch-dialog';const rgb=d111HexRGB(current);pop.innerHTML=`<h4>第 ${index+1} 色 · 編輯 <button id="d111Close" aria-label="關閉單色調整">×</button></h4><div id="d111Preview" class="d111-swatch-preview" style="background:${current}"></div><div class="d111-swatch-row"><label>HEX <input id="d111Hex" value="${current}" maxlength="7" aria-label="色碼 HEX"></label><label>RGB <input id="d111Rgb" value="${rgb.join(',')}" aria-label="色碼 RGB"></label></div><label>色彩 <input type="color" id="d111Color" value="${current}" aria-label="調整色彩"></label><div class="d111-actions"><button id="d111Cancel">取消</button><button id="d111Apply" class="primary">套用此色</button></div>`;document.body.appendChild(pop);
 const box=anchor.getBoundingClientRect();const place=()=>{const bound=pop.getBoundingClientRect();pop.style.left=Math.round(Math.max(8,Math.min(window.innerWidth-bound.width-8,box.left+box.width/2-bound.width/2)))+'px';pop.style.top=Math.round(Math.max(8,Math.min(window.innerHeight-bound.height-8,box.bottom+8)))+'px';};pop.style.left='0';pop.style.top='0';place();let draft=current;
 const hex=pop.querySelector('#d111Hex'),rgi=pop.querySelector('#d111Rgb'),color=pop.querySelector('#d111Color');function repaint(v){if(!d111IsHex(v))return false;draft=v.toUpperCase();pop.querySelector('#d111Preview').style.background=draft;color.value=draft.toLowerCase();hex.value=draft;rgi.value=d111HexRGB(draft).join(',');return true;}color.oninput=e=>repaint(e.target.value);hex.onchange=e=>{if(!repaint(e.target.value))hex.setCustomValidity('請輸入 #RRGGBB');else hex.setCustomValidity('');};rgi.onchange=e=>{const numbers=e.target.value.trim().split(',').map(x=>Number(x.trim()));if(numbers.length!==3||numbers.some(x=>!Number.isInteger(x)||x<0||x>255)){rgi.setCustomValidity('RGB 整數 0~255');rgi.reportValidity();return;}rgi.setCustomValidity('');repaint('#'+numbers.map(x=>x.toString(16).padStart(2,'0')).join(''));};pop.querySelector('#d111Close').onclick=d111CloseColor;pop.querySelector('#d111Cancel').onclick=d111CloseColor;pop.querySelector('#d111Apply').onclick=()=>{if(!d111IsHex(hex.value)){hex.setCustomValidity('格式必須是 #RRGGBB');hex.reportValidity();return;}active.value=hex.value.toUpperCase();active.dispatchEvent(new Event('change',{bubbles:true}));d111WheelPaint(document.getElementById('d18Wheel'));d111CloseColor();};}
d18PaletteRender=function(){d111CloseColor();d111OriginalPaletteRender();const root=document.getElementById('settingPage');if(!root)return;
 const wheel=root.querySelector('#d18Wheel'),row=root.querySelector('#d18ThemeName')?.closest('.d18-palette-input'),sel=root.querySelector('#d18ThemeChoose'),oldLabel=sel?.closest('label');if(row&&sel){row.classList.add('d111-theme-row');oldLabel.hidden=true;row.prepend(sel);row.querySelector('#d18AddTheme').textContent='▣';row.querySelector('#d18AddTheme').title='儲存命名色板';row.querySelector('#d18AddTheme').setAttribute('aria-label','儲存命名色板');row.querySelector('#d18RemoveTheme').textContent='−';row.querySelector('#d18RemoveTheme').title='刪除自訂色板';row.querySelector('#d18RemoveTheme').setAttribute('aria-label','刪除自訂色板');const state=document.createElement('div');state.className='d111-theme-current';state.id='d111ThemeCurrent';state.textContent='目前編輯主題：'+d111ThemeName();row.append(state);sel.addEventListener('change',()=>{state.textContent='目前編輯主題：'+d111ThemeName();});}
 const inline=root.querySelector('#d18ActiveHex')?.closest('.d18-palette-input');if(inline)inline.hidden=true;
 root.querySelector('#d18SwatchStrip').addEventListener('click',e=>{const btn=e.target.closest('[data-swatch]');if(!btn)return;d111SwatchPop(+btn.dataset.swatch,root.querySelector('[data-swatch=\"'+btn.dataset.swatch+'\"]')||btn);});
 let hue=205;wheel.addEventListener('click',e=>{const rect=wheel.getBoundingClientRect(),x=e.clientX-(rect.left+rect.width/2),y=e.clientY-(rect.top+rect.height/2);hue=(Math.atan2(y,x)*180/Math.PI+90+360)%360;d111WheelPaint(wheel,hue);});
 root.querySelector('#d18WheelModes').addEventListener('click',e=>{if(e.target.closest('[data-harmony]'))d111WheelPaint(wheel,hue);});
 root.querySelector('#d18ThemeChoose')?.addEventListener('change',()=>{d111WheelPaint(wheel,hue);});d111WheelPaint(wheel,hue);
};

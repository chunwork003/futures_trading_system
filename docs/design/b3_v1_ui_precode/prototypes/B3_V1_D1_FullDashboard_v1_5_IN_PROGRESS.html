function fits(list,x,y,w,h,ignore){if(x<0||y<0||w<1||h<1||x+w>12||y+h>12)return false;return !list.some(a=>a.id!==ignore&&x<a.x+a.w&&x+w>a.x&&y<a.y+a.h&&y+h>a.y)}function openLayout(){layoutDraft=clone(layout);selectedModule=layoutDraft[0]?.id;modal('工作台版型 · 12 欄座標編輯',`<div class="layout-editor"><div class="editorpane"><strong>＋ 新增模組</strong><p class="muted">可按中央空位＋，或拖到空格。</p><div id="moduleCatalog"></div></div><div class="editorpane"><strong>投資總覽 · 工作台草稿</strong><div id="workbenchCanvas" class="mini-grid"></div></div><div class="editorpane"><strong>選定模組</strong><div id="moduleControls"></div></div></div>`,'layout','儲存版型並返回設定');paintLayout()}function paintLayout(){if(dialogMode!=='layout')return;const c=$('workbenchCanvas');const objs=layoutDraft.map(m=>`<div class="mini-item ${selectedModule===m.id?'selected':''}" draggable="true" data-draggable="${m.id}" style="grid-column:${m.x+1}/span ${m.w};grid-row:${m.y+1}/span ${m.h}"><strong>${m.title}</strong><div class="muted">${m.w}×${m.h} · (${m.x+1},${m.y+1})</div></div>`);const covered=new Set;layoutDraft.forEach(a=>{for(let y=a.y;y<a.y+a.h;y++)for(let x=a.x;x<a.x+a.w;x++)covered.add(`${x},${y}`)});const empty=[];for(let y=0;y<8;y++)for(let x=0;x<12;x++)if(!covered.has(`${x},${y}`))empty.push(`<button class="mini-empty" data-empty="${x},${y}" data-x="${x}" data-y="${y}" style="grid-column:${x+1};grid-row:${y+1}" aria-label="空白格 ${x+1},${y+1}，點擊新增">＋</button>`);c.innerHTML=[...empty,...objs].join('');c.querySelectorAll('[data-empty]').forEach(b=>{b.onclick=()=>addAt(+b.dataset.x,+b.dataset.y);b.ondragover=e=>{e.preventDefault();document.querySelectorAll('.mini-empty.drag-preview').forEach(z=>z.classList.remove('drag-preview'));const id=e.dataTransfer.getData('text/plain')||window.__dragModule;const m=layoutDraft.find(a=>a.id===id);if(m&&fits(layoutDraft,+b.dataset.x,+b.dataset.y,m.w,m.h,id)){const x=+b.dataset.x,y=+b.dataset.y;document.querySelectorAll('.mini-empty').forEach(z=>{if(+z.dataset.x>=x&&+z.dataset.x<x+m.w&&+z.dataset.y>=y&&+z.dataset.y<y+m.h)z.classList.add('drag-preview')})}};b.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain')||window.__dragModule,m=layoutDraft.find(a=>a.id===id);if(m&&fits(layoutDraft,+b.dataset.x,+b.dataset.y,m.w,m.h,id)){m.x=+b.dataset.x;m.y=+b.dataset.y;selectedModule=id;paintLayout()}else toast('落點空間不足，不能與其他模組重疊')}});c.querySelectorAll('[data-draggable]').forEach(b=>{b.onclick=()=>{selectedModule=b.dataset.draggable;paintLayout()};b.ondragstart=e=>{window.__dragModule=b.dataset.draggable;e.dataTransfer.setData('text/plain',b.dataset.draggable);b.classList.add('dragging')};b.ondragend=()=>{window.__dragModule='';document.querySelectorAll('.mini-empty.drag-preview').forEach(z=>z.classList.remove('drag-preview'));b.classList.remove('dragging')}});$('moduleCatalog').innerHTML=[['overview','概要'],['capital','資金'],['strategy','策略績效'],['assets','資產卡'],['holdings','持倉'],['trend','組合走勢']].map(([k,n])=>`<button data-cat="${k}" style="display:block;width:100%;text-align:left;margin:5px 0">＋ ${n}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{for(let y=0;y<8;y++)for(let x=0;x<12;x++)if(fits(layoutDraft,x,y,3,1)){addAt(x,y,b.dataset.cat);return}toast('目前沒有可放置的 3×1 空格')});const m=layoutDraft.find(a=>a.id===selectedModule);$('moduleControls').innerHTML=m?`<p><strong>${m.title}</strong></p><label class="formfield">寬度（格）<input id="moveW" type="number" min="1" max="12" value="${m.w}"></label><label class="formfield">高度（格）<input id="moveH" type="number" min="1" max="4" value="${m.h}"></label><div class="review-actions"><button data-shift="-1,0">←</button><button data-shift="1,0">→</button><button data-shift="0,-1">↑</button><button data-shift="0,1">↓</button></div><button id="removeChosen" style="margin-top:12px">移除模組（釋出空格）</button>`:'請選取模組';if(m){document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.shift.split(',').map(Number);if(fits(layoutDraft,m.x+dx,m.y+dy,m.w,m.h,m.id)){m.x+=dx;m.y+=dy;paintLayout()}else toast('目標座標已占用或超出頁面')});for(const field of ['moveW','moveH'])$(field).onchange=()=>{const w=field==='moveW'?+$(field).value:m.w,h=field==='moveH'?+$(field).value:m.h;if(fits(layoutDraft,m.x,m.y,w,h,m.id)){m.w=w;m.h=h;paintLayout()}else{toast('尺寸與現有模組衝突');paintLayout()}};$('removeChosen').onclick=()=>{layoutDraft=layoutDraft.filter(v=>v.id!==m.id);selectedModule=layoutDraft[0]?.id;paintLayout()}}}function addAt(x,y,type='overview'){const old=initial.find(m=>m.id===type)||{title:'自訂模組',subject:'portfolio'};const w=3,h=1;if(!fits(layoutDraft,x,y,w,h))return toast('此處不足 3×1 空間，請先移動或縮小模組');const m={id:`add-${Date.now()}-${Math.random().toString(36).slice(2,5)}`,title:old.title,x,y,w,h,subject:old.subject};layoutDraft.push(m);selectedModule=m.id;paintLayout()}
function openModule(){moduleDraft={subject:'capital',cols:2,rows:1,slots:[]};activeCell=null;modal('模組 · 同一資料主體 NxM 編輯器',`<div class="grid2" style="grid-template-columns:2fr 1fr"><div><div class="review-actions"><label>資料主體<select id="modSubject">${Object.entries(subjects).map(([v,n])=>`<option value="${v}" ${v==='capital'?'selected':''}>${n}</option>`).join('')}</select></label><label>橫向格數<select id="modCols">${[1,2,3,4,5,6,8,12].map(x=>`<option ${x===2?'selected':''}>${x}</option>`).join('')}</select></label><label>垂直格數<select id="modRows">${[1,2,3,4].map(x=>`<option ${x===1?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="muted">每一格至少 1×1，可持續加入合法格位；先點左側 +，才出現右側資料設定。圖形與金額均屬同一主體。</p><div id="modGrid" class="mod-grid" style="--c:2;--r:1"></div><p class="caption" id="modStatus">待建立資料區塊</p></div><div class="inspector" id="modInspector">選取左側 ＋ 後，在此指定資料／呈現方式。</div></div>`, 'module','儲存模組並返回設定');for(const k of ['modSubject','modCols','modRows'])$(k).onchange=()=>{if(k==='modSubject')moduleDraft.subject=$(k).value;else{moduleDraft.cols=+$('modCols').value;moduleDraft.rows=+$('modRows').value;moduleDraft.slots=moduleDraft.slots.filter(a=>a.x+a.w<=moduleDraft.cols&&a.y+a.h<=moduleDraft.rows);activeCell=null}paintModule()};paintModule()}function paintModule(){const d=moduleDraft,c=$('modGrid');c.style.setProperty('--c',d.cols);c.style.setProperty('--r',d.rows);const occupancy=new Set;d.slots.forEach(a=>{for(let y=a.y;y<a.y+a.h;y++)for(let x=a.x;x<a.x+a.w;x++)occupancy.add(`${x},${y}`)});let markup='';for(let y=0;y<d.rows;y++)for(let x=0;x<d.cols;x++)if(!occupancy.has(`${x},${y}`))markup+=`<div class="modslot" style="grid-column:${x+1};grid-row:${y+1}"><button data-mod-empty="${x},${y}" aria-label="增加單元 ${x+1},${y+1}">＋</button></div>`;d.slots.forEach((a,i)=>markup+=`<div class="modslot ${activeCell===i?'selected':''}" draggable="true" data-slot="${i}" style="grid-column:${a.x+1}/span ${a.w};grid-row:${a.y+1}/span ${a.h}"><button data-slotclick="${i}">${a.kind||'未綁定'}</button></div>`);c.innerHTML=markup;document.querySelectorAll('[data-mod-empty]').forEach(b=>{b.onclick=()=>{const[x,y]=b.dataset.modEmpty.split(',').map(Number);d.slots.push({x,y,w:1,h:1,kind:'KPI',field:'目前金額'});activeCell=d.slots.length-1;paintModule()};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();const i=+e.dataTransfer.getData('text/plain'),[x,y]=b.dataset.modEmpty.split(',').map(Number),a=d.slots[i];if(a&&!d.slots.some((v,j)=>j!==i&&x<v.x+v.w&&x+a.w>v.x&&y<v.y+v.h&&y+a.h>v.y)&&x+a.w<=d.cols&&y+a.h<=d.rows){a.x=x;a.y=y;paintModule()}else toast('這個位置不足容納所選區塊')}});document.querySelectorAll('[data-slot]').forEach(b=>{b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.slot)});document.querySelectorAll('[data-slotclick]').forEach(b=>b.onclick=()=>{activeCell=+b.dataset.slotclick;paintModule()});$('modStatus').textContent=`已建立 ${d.slots.length} 個資料區塊／總格數 ${d.cols*d.rows}，未使用 ${d.cols*d.rows-occupancy.size} 格。無四區塊上限。`;const a=d.slots[activeCell];$('modInspector').innerHTML=a?`<h3>資料區塊 ${activeCell+1}</h3><p>主體：${subjects[d.subject]}</p><label class="formfield">資料欄位<select id="slotField">${['目前金額','區間變化','歷史資料','分類權重','品質／來源'].map(v=>`<option ${a.field===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="formfield">呈現形式<select id="slotKind">${Object.entries(units).map(([k,n])=>`<option value="${k}" ${a.kind===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="formfield">寬格數<input type="number" min="1" max="12" value="${a.w}" id="slotW"></label><label class="formfield">高格數<input type="number" min="1" max="4" value="${a.h}" id="slotH"></label><button id="delSlot">刪除此資料區塊</button><p class="muted">歷史資料必須由來源提供正式序列；示意圖不代表存在相應 API。</p>`:'<h3>資料設定</h3><p>點選左側 ＋ 才指定欄位與圖文形式。</p>';if(a){$('slotField').onchange=e=>{a.field=e.target.value;paintModule()};$('slotKind').onchange=e=>{a.kind=e.target.value;paintModule()};for(const k of ['slotW','slotH'])$(k).onchange=e=>{const w=k==='slotW'?+e.target.value:a.w,h=k==='slotH'?+e.target.value:a.h;if(a.x+w>d.cols||a.y+h>d.rows||d.slots.some((v,j)=>j!==activeCell&&a.x<v.x+v.w&&a.x+w>v.x&&a.y<v.y+v.h&&a.y+h>v.y))toast('不可重疊或越界');else{a.w=w;a.h=h}paintModule()};$('delSlot').onclick=()=>{d.slots.splice(activeCell,1);activeCell=null;paintModule()}}}
$('dlgSave').onclick=()=>{if(dialogMode==='layout'){layout=clone(layoutDraft);render();closeModal(true);toast('版型已儲存（本頁草案）');return}if(dialogMode==='module'){if(!moduleDraft.slots.length)return toast('請先新增至少一格資訊');const d=clone(moduleDraft);d.id='module-'+Date.now();d.name=`${subjects[d.subject]} ${d.cols}×${d.rows}`;definitions.push(d);closeModal(true);settingPage='module';openSettings('module');toast('模組已保存至本頁模組庫');return}if(dialogMode==='quick'){icons=clone(editIcons);renderRail();closeModal();toast('快捷圖示已更新（設計草案）');return}closeModal();toast('視覺設定已套用至本頁概念預覽')};

fly.addEventListener('mouseenter',()=>clearTimeout(railCloseTimer));fly.addEventListener('mouseleave',queueRailClose);$('rail').addEventListener('mouseenter',()=>clearTimeout(railCloseTimer));$('rail').addEventListener('mouseleave',queueRailClose);

const NAV={portfolio:[['目前投資組合','UI01'],['資產配置','UI08'],['現金流','UI12']],market:[['台股／股票','UI03'],['台股／ETF','UI03'],['美股／股票','UI03'],['圖表','UI02']],lab:[['策略編輯','UI04'],['研究','UI05'],['比較','UI06'],['債券／利率實驗室','UI13']],tools:[['計算工具（候選）','UI03'],['圖表工具','UI02']],trade:[['PAPER 模擬','UI07'],['委託（權限驗證後）','UI09'],['倉位','UI10'],['風險','UI11']],news:[['持有標的新聞（候選）','UI01'],['市場新聞（候選）','UI03']]};
const topFly=$('topFly');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=e=>{const k=b.dataset.nav;if(!topFly.hidden&&topFly.dataset.active===k){topFly.hidden=true;return}topFly.dataset.active=k;const r=b.getBoundingClientRect();topFly.style.left=Math.min(r.left,window.innerWidth-250)+'px';topFly.innerHTML=(NAV[k]||[]).map(([n,ui])=>`<button data-route="${ui}" title="正式 ${ui} 仍需 API/權限查證">${n} · ${ui}</button>`).join('');topFly.hidden=false;topFly.querySelectorAll('[data-route]').forEach(x=>x.onclick=()=>{topFly.hidden=true;toast(x.textContent+' · 路由預覽，正式頁面未實作')})});document.addEventListener('click',e=>{if(!topFly.hidden&&!e.target.closest('#topMenu')&&!e.target.closest('#topFly'))topFly.hidden=true});
render();renderRail();document.addEventListener('click',e=>{if(!$('flyout').hidden&&!e.target.closest('.flyout')&&!e.target.closest('[data-rail]')){$('flyout').hidden=true;document.querySelectorAll('[data-rail]').forEach(b=>b.classList.remove('active'))}});

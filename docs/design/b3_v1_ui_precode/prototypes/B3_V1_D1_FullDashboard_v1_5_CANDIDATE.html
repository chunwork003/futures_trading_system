(()=>{'use strict';const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));const initial=[{id:'overview',title:'投資組合概要',x:0,y:0,w:3,h:1,subject:'portfolio'},{id:'capital',title:'資金 · 可用與已配置',x:3,y:0,w:3,h:1,subject:'capital'},{id:'strategy',title:'策略績效',x:6,y:0,w:3,h:1,subject:'portfolio'},{id:'news',title:'持有標的新聞',x:9,y:0,w:3,h:1,subject:'news'},{id:'trend',title:'組合表現 · 分類／策略',x:0,y:1,w:8,h:2,subject:'portfolio'},{id:'allocation',title:'資產分布',x:8,y:1,w:4,h:2,subject:'portfolio'},{id:'assets',title:'分類資產 · 金額／投報',x:0,y:3,w:6,h:2,subject:'portfolio'},{id:'holdings',title:'持有資產清單',x:6,y:3,w:6,h:2,subject:'portfolio'}];let layout=clone(initial),icons={portfolio:'▦',market:'⌁',lab:'⚗',schedule:'◷',engineering:'☷'},railLinks={portfolio:['總覽 · UI01','資產配置 · UI08'],market:['市場商品 · UI03','圖表 · UI02'],lab:['研究 · UI05','策略編輯 · UI04'],schedule:['研究排程 · UI05（候選）'],engineering:['Automation · UI16']},assets=[['股票','833,000','+1.7%'],['債券 ETF','1,006,250','+2.1%'],['長期 ETF','490,000','+5.1%'],['台灣期貨','630,000','-3.2%'],['現金','378,000','+0.0%'],['其他','157,500','UNKNOWN'],['債券','310,000','+0.4%'],['海外股票','283,000','-0.7%']];let assetTab='總覽',assetPage=0,holdingPage=0,layoutDraft=null,moduleDraft=null,activeCell=null,selectedModule=null,dialogMode='',dialogReturn='settings',settingPage='palette',editIcons=null,selectedGroup='portfolio',mouseIndex=null;const units={KPI:'主金額與變化',line:'近期折線',bar:'分類長條',list:'固定清單',quality:'資料品質',text:'來源描述'},subjects={portfolio:'投資組合',capital:'目前資金',strategy:'策略績效',asset:'資產類別',market:'市場商品'};let definitions=[{id:'custom-capital',name:'目前資金雙格',subject:'capital',cols:2,rows:1,slots:[{x:0,y:0,w:1,h:1,kind:'KPI'},{x:1,y:0,w:1,h:1,kind:'line'}]}];let lastDialog='';const currencies=s=>$('stateSel').value==='UNKNOWN'?'—':s;function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2300)}function sparkline(values,color='#67bffa',klass='spark'){const min=Math.min(...values),max=Math.max(...values),dif=max-min||1;const points=values.map((v,i)=>`${(i*100/(values.length-1)).toFixed(1)},${(41-(v-min)/dif*32).toFixed(1)}`).join(' ');return `<svg class="${klass}" viewBox="0 0 100 46" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`}function pager(id,cur,total){return total>1?`<span class="pager"><button class="small" data-pg="${id}:prev" aria-label="上一頁">‹</button><span>${cur+1}/${total}</span><button class="small" data-pg="${id}:next" aria-label="下一頁">›</button></span>`:''}function head(m){return `<div class="card-head"><span>${m.title}</span>${m.id==='assets'?pager('assets',assetPage,Math.ceil((assetTab==='總覽'?assets:assets.filter(x=>x[0]===assetTab)).length/6)):m.id==='holdings'?pager('holdings',holdingPage,2):''}</div>`}function fieldCap(label,value,change){return `<div class="metric-line"><span class="minor">${label}</span><strong class="${change.startsWith('-')?'loss':'change'}">${change}</strong></div><div class="big">${currencies(value)}</div>`}function body(m){const state=$('stateSel').value;if(m.id==='overview')return `<div class="minor">帳戶權益 · DEMO</div>${fieldCap('全部組合','NT$ 3.50M','+6.2%')}<div class="metric-line"><span>較前期 +NT$ 204,000</span><span class="minor">近一年</span></div>`;if(m.id==='capital')return `<div class="minor">目前資金 · 選定觀測範圍</div><div class="big">${currencies('NT$ 82.0萬')}</div><div class="tabs">${['日','週','雙週','月'].map(x=>`<button class="small ${x==='週'?'current':''}" data-period="${x}">${x}</button>`).join('')}</div>${sparkline([73,76,72,81,78,83,82])}<div class="metric-line"><span>週區間變化</span><b class="loss">−NT$ 39,000　−4.47%</b></div>`;if(m.id==='strategy')return `<div class="minor">策略績效 · 合成比較</div>${[['趨勢策略','+6.2%',.64],['收益策略','+4.4%',.45],['利率循環','+1.0%',.27]].map(([n,p,w])=>`<div class="metric-line"><span>${n}</span><b class="change">${p}</b></div><div style="height:6px;border-radius:5px;background:#263b56"><div style="height:6px;width:${w*100}%;border-radius:5px;background:#58a5d8"></div></div>`).join('')}`;if(m.id==='news')return `<div class="minor">新聞來源尚未核實</div><strong>持有標的相關消息（示意）</strong><p>新聞內容示意；正式來源與授權待驗證。</p><div class="metric-line"><span class="status">UNVERIFIED</span>${pager('news',0,3)}</div>`;if(m.id==='trend')return `<div class="metric-line"><strong>${currencies('NT$ 3,500,000')}</strong><span class="change">較前期 +NT$ 86,000 (+2.5%)</span></div><div class="tabs">${['天','週','雙週','月','季','半年','年'].map(x=>`<button class="small ${x==='月'?'current':''}" data-period="${x}">${x}</button>`).join('')}</div><div class="linechart"><div class="chart-area" id="trendPlot">${sparkline([317,323,329,325,330,332,345,352,348,355,361], '#ffce7b','spark long')}<div class="stack">${[0,1,2,3,4,5].map((i)=>`<div class="stackcol">${[24+i*3,17+i,12+i,8+i].map((v,j)=>`<div class="stackpart" style="height:${v}%;background:${['#45a6b5','#6c9ee0','#b7a363','#906caa'][j]}"></div>`).join('')}</div>`).join('')}</div><div class="charttip" id="trendTip" hidden></div></div><div class="chartnote">股票　■<br>債券　■<br>期貨　■<br>現金／其他　■<br><br>懸停圖表顯示分項變化</div></div><div class="minor">TWD／萬 · Snapshot 示意 · Source/Cut 待綁定</div>`;if(m.id==='allocation')return `<div class="minor">資產配置 · 合成資料</div><div style="display:flex;justify-content:center;align-items:center;min-height:110px"><div style="width:112px;height:112px;border-radius:50%;background:conic-gradient(#38a7b9 0 26%,#678de2 26% 55%,#b49b5d 55% 71%,#8e6fbe 71% 86%,#3ab490 86% 100%);display:grid;place-items:center"><div style="border-radius:100%;width:62px;height:62px;background:var(--card);display:grid;place-items:center">資產</div></div></div><div class="metric-line"><span>股票 23.9%</span><span>債券 ETF 28.9%</span></div><div class="metric-line"><span>期貨 18.1%</span><span>現金及其他 29.1%</span></div>`;if(m.id==='assets'){const tabs=['總覽','股票','債券 ETF','台灣期貨','長期 ETF','現金','其他'];const d=assetTab==='總覽'?assets:assets.filter(x=>x[0]===assetTab);const pages=Math.max(1,Math.ceil(d.length/6));assetPage=Math.min(assetPage,pages-1);return `<div class="tabs">${tabs.map(t=>`<button data-tab="${t}" class="${assetTab===t?'current':''}">${t}</button>`).join('')}</div><div class="asset-grid">${Array.from({length:6},(_,i)=>{const a=d[assetPage*6+i];return a?`<div class="asset"><b>${a[0]}</b><section><span class="minor">金額／投報</span><strong>${currencies('NT$ '+a[1])}</strong>${sparkline([12+i,15+i,13+i,21+i,23+i,22+i])}<span class="${a[2].startsWith('-')?'loss':'change'}">${a[2]}</span></section></div>`:`<div class="asset placeholder" aria-hidden="true"></div>`}).join('')}</div>`}if(m.id==='holdings'){const d=Array.from({length:8},(_,i)=>['TXF / ETF / Stock '+(i+1),(700000-i*67000).toLocaleString(),`${i%2?'-':'+'}${((i+1)*.6).toFixed(1)}%`]);return `<div class="controlrow"><span class="muted">Portfolio Assets · 六筆固定容量</span><span class="pager">${pager('holdings',holdingPage,2)}</span></div><div class="data-rows">${Array.from({length:6},(_,i)=>{const a=d[holdingPage*6+i];return a?`<div class="data-row"><strong>${a[0]}</strong><span>${currencies('NT$ '+a[1])}</span><span class="${a[2][0]==='-'?'loss':'change'}">${a[2]}</span></div>`:`<div class="data-row empty" aria-hidden="true">　</div>`}).join('')}</div>`}{const d=definitions.find(x=>x.id===m.templateId);if(!d)return `<strong>${m.title}</strong><p class="muted">自訂模組示意</p>`;return `<div style="display:grid;grid-template-columns:repeat(${d.cols},minmax(0,1fr));grid-template-rows:repeat(${d.rows},minmax(0,1fr));gap:5px;flex:1;min-height:0">${d.slots.map((a,i)=>`<div style="grid-column:${a.x+1}/span ${a.w};grid-row:${a.y+1}/span ${a.h};background:#102137;border:1px solid #355d7b;padding:8px;border-radius:6px;min-width:0;min-height:0;overflow:hidden"><div class="minor">${a.field||'示意指標'}（${subjects[d.subject]}）</div>${a.kind==='line'?sparkline([6,8,7,9,11,10,13]):a.kind==='bar'?'<div style="height:22px;background:linear-gradient(90deg,#56b7fa 40%,#284669 40%)"></div>':a.kind==='KPI'?`<strong>${currencies(d.subject==='capital'?'NT$ 82.0萬':'NT$ 3.5M')}</strong>`:a.kind==='quality'?'<span class="minor">Source/Cut：DEMO</span>':'<span class="minor">來源核實後顯示</span>'}</div>`).join('')}</div>`}}function render(){const root=$('dashboard');root.innerHTML=layout.map(m=>`<article class="card" data-card="${m.id}" style="grid-column:${m.x+1}/span ${m.w};grid-row:${m.y+1}/span ${m.h}">${head(m)}<div class="card-body">${body(m)}</div></article>`).join('');root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{assetTab=b.dataset.tab;assetPage=0;render()});root.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const[id,dir]=b.dataset.pg.split(':');if(id==='assets')assetPage=(assetPage+(dir==='next'?1:-1)+Math.max(1,Math.ceil((assetTab==='總覽'?assets:assets.filter(a=>a[0]===assetTab)).length/6)))%Math.max(1,Math.ceil((assetTab==='總覽'?assets:assets.filter(a=>a[0]===assetTab)).length/6));else if(id==='holdings')holdingPage=(holdingPage+(dir==='next'?1:-1)+2)%2;render()});const plot=$('trendPlot');if(plot){plot.onmousemove=e=>{const i=Math.min(5,Math.max(0,Math.floor((e.offsetX/Math.max(1,plot.clientWidth))*6)));const v=320+i*7;const tip=$('trendTip');tip.hidden=false;tip.innerHTML=`<strong>期間 ${i+1}</strong><br>總額 ${v} 萬 · +2.5%<br>股票 +${9+i} 萬<br>債券 +${4+i} 萬<br>期貨 ${i%2?'-':'+'}${3+i} 萬<br>現金／其他 +2 萬`;tip.style.left=Math.min(plot.clientWidth-115,Math.max(4,e.offsetX+12))+'px'};plot.onmouseleave=()=>{$('trendTip').hidden=true}}}function renderRail(){document.querySelectorAll('[data-rail]').forEach(b=>{const ico=icons[b.dataset.rail]||'□';if(ico.startsWith('data:image/')){b.innerHTML='<img alt="" style="height:25px;width:25px;object-fit:contain" src="'+ico+'">'}else b.textContent=ico;b.onclick=()=>{const k=b.dataset.rail;const f=$('flyout');if(!f.hidden&&selectedGroup===k){f.hidden=true;b.classList.remove('active');return}selectedGroup=k;document.querySelectorAll('[data-rail]').forEach(v=>v.classList.toggle('active',v.dataset.rail===k));$('flyhead').textContent=({portfolio:'投資組合',market:'市場／圖表',lab:'實驗室',schedule:'更新／排程',engineering:'工程／審核'})[k];$('flylinks').innerHTML=(railLinks[k]||[]).map(x=>`<button class="link">${x}</button>`).join('');f.hidden=false}})}function modal(title,body,mode,saveLabel='儲存'){dialogMode=mode;$('dlgTitle').textContent=title;$('dlgBody').innerHTML=body;$('dlgSave').textContent=saveLabel;$('shade').hidden=false;document.querySelector('.dialog').style.height=mode==='layout'?'min(850px,94dvh)':'min(800px,94dvh)'}function closeModal(returnToSettings=false){$('shade').hidden=true;dialogMode='';if(returnToSettings){openSettings(settingPage)}}$('closeDialog').onclick=()=>closeModal(['layout','module'].includes(dialogMode));$('dlgCancel').onclick=()=>closeModal(['layout','module'].includes(dialogMode));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('shade').hidden){e.preventDefault();closeModal(['layout','module'].includes(dialogMode))}else if(e.key==='Escape'){$('flyout').hidden=true}});$('flyclose').onclick=()=>{$('flyout').hidden=true;document.querySelectorAll('[data-rail]').forEach(b=>b.classList.remove('active'))};$('stateSel').onchange=render;$('filterButton').onclick=()=>toast('篩選規則預設沿用 D1 v1.3，詳細篩選將於 UI08 核對');$('settingsEntry').onclick=()=>openSettings();$('quickEdit').onclick=()=>openQuick();function openSettings(tab='palette'){settingPage=tab;const tabs=[['palette','面板／配色'],['workbench','工作台版型'],['module','模組'],['start','啟動／多視窗']];const content=`<div class="setting-tabs">${tabs.map(([k,v])=>`<button data-setting="${k}" class="${k===tab?'current':''}">${v}</button>`).join('')}</div><hr style="border-color:var(--border)"><div id="settingPage"></div>`;modal('全域設定 · D1 v1.5 CANDIDATE',content,'settings','套用目前設定');document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{settingPage=b.dataset.setting;openSettings(settingPage)});let item='';if(tab==='palette'){item=`<p class="muted">視覺審核：各角色調色一致；HEX 僅在懸停或編輯時顯示。預設深藍、翡翠、暖棕。</p><div class="review-actions">${['#56b7fa','#c79364','#6fb3a5'].map(c=>`<button data-theme="${c}" style="border-bottom:5px solid ${c}">${c==='#56b7fa'?'深藍':c==='#c79364'?'暖棕':'翡翠'}</button>`).join('')}</div><div class="colorgrid" style="margin-top:20px">${[['--bg','背景'],['--sidebar','導覽'],['--card','模組'],['--header','標題列'],['--border','框線'],['--accent','互動色'],['--text','主要文字'],['--muted','次要文字']].map(([v,n])=>`<label class="swatch" title="${v}"><input type="color" data-color="${v}" value="${getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#18283e'}"><span>${n}</span><input style="width:85px" data-hex="${v}" value="${getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#18283e'}"></label>`).join('')}</div>`}else if(tab==='workbench'){item='<h3>工作台版型</h3><p class="muted">配置首頁模組位置、增減、格線；編輯會進入獨立草稿視窗，儲存或取消後返回本頁。</p><button id="startLayout" class="primary">進入工作台版型編輯器</button>'}else if(tab==='module'){item='<h3>模組 · 同一資料主體的不同呈現方式</h3><p class="muted">統一建立與模組版型。選同一資料主體→NxM 單元→按 + 新增資訊→選數值／圖形形式；不使用 S～XL 或強制自訂名稱。</p><button id="startModule" class="primary">建立模組</button><h4>我的模組</h4><div>'+definitions.map(d=>`<div class="status" style="margin:7px 0">${d.name}／${subjects[d.subject]||d.subject}／${d.cols}×${d.rows} <button data-use="${d.id}" class="small">加入工作台</button></div>`).join('')+'</div>'}else{item='<h3>啟動與多視窗</h3><label class="formfield">啟動模式<select><option>投資總覽（預設）</option><option>使用者指定工作區</option><option>上次工作區</option></select></label><p class="muted">多視窗帳戶／環境隔離需正式 Auth／BFF 契約審查，此畫面不提供帳戶實際切換。</p>'}$('settingPage').innerHTML=item;if(tab==='palette'){document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--accent',b.dataset.theme);toast('色彩預覽已改變，按套用保存設計偏好')});document.querySelectorAll('[data-color]').forEach(i=>i.oninput=()=>{document.documentElement.style.setProperty(i.dataset.color,i.value);document.querySelector(`[data-hex="${i.dataset.color}"]`).value=i.value});document.querySelectorAll('[data-hex]').forEach(i=>i.onchange=()=>{i

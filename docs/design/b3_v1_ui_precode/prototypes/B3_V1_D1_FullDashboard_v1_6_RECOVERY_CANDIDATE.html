lues),dif=max-min||1;const points=values.map((v,i)=>`${(i*100/(values.length-1)).toFixed(1)},${(41-(v-min)/dif*32).toFixed(1)}`).join(' ');return `<svg class="${klass}" viewBox="0 0 100 46" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`}function pager(id,cur,total){return total>1?`<span class="pager"><button class="small" data-pg="${id}:prev" aria-label="上一頁">‹</button><span>${cur+1}/${total}</span><button class="small" data-pg="${id}:next" aria-label="下一頁">›</button></span>`:''}function head(m){return `<div class="card-head"><span>${m.title}</span>${m.id==='assets'?pager('assets',assetPage,Math.ceil((assetTab==='總覽'?assets:assets.filter(x=>x[0]===assetTab)).length/6)):m.id==='holdings'?pager('holdings',holdingPage,2):''}</div>`}function fieldCap(label,value,change){return `<div class="metric-line"><span class="minor">${label}</span><strong class="${change.startsWith('-')?'loss':'change'}">${change}</strong></div><div class="big">${currencies(value)}</div>`}const trendPeriods=['25-11','25-12','26-01','26-02','26-03','26-04'];
const strategySeries=[
  {name:'趨勢策略',color:'#45a6b5',values:[120,126,132,129,137,145]},
  {name:'收益策略',color:'#6c9ee0',values:[80,83,86,90,92,95]},
  {name:'套利策略',color:'#b7a363',values:[70,68,72,69,73,75]},
  {name:'其他策略',color:'#906caa',values:[42,45,41,44,46,47]}
];
function strategyBars(){let r='<svg viewBox="0 0 660 120" width="100%" height="112px" preserveAspectRatio="none" role="img" aria-label="每期四種策略的前期金額變化（萬 TWD）；合成數據">';r+='<line x1="20" x2="640" y1="64" y2="64" stroke="#8296a9" stroke-dasharray="4,3" opacity=".8"/>';
for(let i=0;i<trendPeriods.length;i++){let cx=58+i*104;strategySeries.forEach((it,j)=>{const diff=i===0?0:it.values[i]-it.values[i-1],y=diff>=0?64-Math.abs(diff)*4:64;const height=Math.abs(diff)*4;r+=`<rect x="${cx+j*15-22}" y="${y}" width="11" height="${height}" rx="1" fill="${it.color}" aria-label="${trendPeriods[i]} ${it.name} ${diff}萬"/>`});r+=`<text x="${cx}" y="110" text-anchor="middle" fill="#aac0d7" font-size="12">${trendPeriods[i]}</text>`}return r+'</svg>'}
function strategyTooltip(i){const sum=(j)=>strategySeries.reduce((v,x)=>v+x.values[j],0);let t=`<strong>${trendPeriods[i]} · 合計 ${sum(i).toFixed(1)} 萬</strong>`;if(i>0){const d=sum(i)-sum(i-1);t+=`<br>合計較前期 ${d>=0?'+':''}${d.toFixed(1)} 萬 (${(d/sum(i-1)*100).toFixed(2)}%)`}else t+='<br>基準期：無前期比較';for(const x of strategySeries){let d=i?x.values[i]-x.values[i-1]:null;t+=`<br>${x.name}: ${x.values[i]} 萬`+(d===null?'（基準期）':`，${d>=0?'+':''}${d.toFixed(1)} 萬 (${(d/x.values[i-1]*100).toFixed(2)}%)`)}return t}
function body(m){const state=$('stateSel').value;if(m.id==='overview')return `<div class="minor">帳戶權益 · DEMO</div>${fieldCap('全部組合','NT$ 3.50M','+6.2%')}<div class="metric-line"><span>較前期 +NT$ 204,000</span><span class="minor">近一年</span></div>`;if(m.id==='capital')return `<div class="minor">目前資金 · 選定觀測範圍</div><div class="big">${currencies('NT$ 82.0萬')}</div><div class="tabs">${['日','週','雙週','月'].map(x=>`<button class="small ${x==='週'?'current':''}" data-period="${x}">${x}</button>`).join('')}</div>${sparkline([73,76,72,81,78,83,82])}<div class="metric-line"><span>週區間變化</span><b class="loss">−NT$ 39,000　−4.47%</b></div>`;if(m.id==='strategy')return `<div class="minor">策略績效 · 合成比較</div>${[['趨勢策略','+6.2%',.64],['收益策略','+4.4%',.45],['利率循環','+1.0%',.27]].map(([n,p,w])=>`<div class="metric-line"><span>${n}</span><b class="change">${p}</b></div><div style="height:6px;border-radius:5px;background:#263b56"><div style="height:6px;width:${w*100}%;border-radius:5px;background:#58a5d8"></div></div>`).join('')}`;if(m.id==='news')return `<div class="minor">新聞來源尚未核實</div><strong>持有標的相關消息（示意）</strong><p>新聞內容示意；正式來源與授權待驗證。</p><div class="metric-line"><span class="status">UNVERIFIED</span>${pager('news',0,3)}</div>`;if(m.id==='trend')return `<div class="metric-line"><strong>${currencies('NT$ 3,500,000')}</strong><span class="change">較前期 +NT$ 86,000 (+2.5%)</span></div><div class="tabs">${['天','週','雙週','月','季','半年','年'].map(x=>`<button class="small ${x==='月'?'current':''}" data-period="${x}">${x}</button>`).join('')}</div><div class="linechart"><div class="chart-area" id="trendPlot">${sparkline([312,322,331,332,348,362], '#ffce7b','spark long')}<div class="stack">${strategyBars()}</div><div class="charttip" id="trendTip" hidden></div></div><div class="chartnote">策略／組合分項變化（每期各色獨立柱）<br>趨勢　■<br>收益　■<br>套利　■<br>其他　■<br><br>懸停圖表顯示分項變化</div></div><div class="minor">TWD／萬 · Snapshot 示意 · Source/Cut 待綁定</div>`;if(m.id==='allocation')return `<div class="minor">資產配置 · 合成資料</div><div style="display:flex;justify-content:center;align-items:center;min-height:110px"><div style="width:112px;height:112px;border-radius:50%;background:conic-gradient(#38a7b9 0 26%,#678de2 26% 55%,#b49b5d 55% 71%,#8e6fbe 71% 86%,#3ab490 86% 100%);display:grid;place-items:center"><div style="border-radius:100%;width:62px;height:62px;background:var(--card);display:grid;place-items:center">資產</div></div></div><div class="metric-line"><span>股票 23.9%</span><span>債券 ETF 28.9%</span></div><div class="metric-line"><span>期貨 18.1%</span><span>現金及其他 29.1%</span></div>`;if(m.id==='assets'){const tabs=['總覽','股票','債券 ETF','台灣期貨','長期 ETF','現金','其他'];const d=assetTab==='總覽'?assets:assets.filter(x=>x[0]===assetTab);const pages=Math.max(1,Math.ceil(d.length/6));assetPage=Math.min(assetPage,pages-1);return `<div class="tabs">${tabs.map(t=>`<button data-tab="${t}" class="${assetTab===t?'current':''}">${t}</button>`).join('')}</div><div class="asset-grid">${Array.from({length:6},(_,i)=>{const a=d[assetPage*6+i];return a?`<div class="asset"><b>${a[0]}</b><section><span class="minor">金額／投報</span><strong>${currencies('NT$ '+a[1])}</strong>${sparkline([12+i,15+i,13+i,21+i,23+i,22+i])}<span class="${a[2].startsWith('-')?'loss':'change'}">${a[2]}</span></section></div>`:`<div class="asset placeholder" aria-hidden="true"></div>`}).join('')}</div>`}if(m.id==='holdings'){const d=Array.from({length:8},(_,i)=>['TXF / ETF / Stock '+(i+1),(700000-i*67000).toLocaleString(),`${i%2?'-':'+'}${((i+1)*.6).toFixed(1)}%`]);return `<div class="controlrow"><span class="muted">Portfolio Assets · 六筆固定容量</span><span class="pager">${pager('holdings',holdingPage,2)}</span></div><div class="data-rows">${Array.from({length:6},(_,i)=>{const a=d[holdingPage*6+i];return a?`<div class="data-row"><strong>${a[0]}</strong><span>${currencies('NT$ '+a[1])}</span><span class="${a[2][0]==='-'?'loss':'change'}">${a[2]}</span></div>`:`<div class="data-row empty" aria-hidden="true">　</div>`}).join('')}</div>`}{const d=definitions.find(x=>x.id===m.templateId);if(!d)return `<strong>${m.title}</strong><p class="muted">自訂模組示意</p>`;return `<div style="display:grid;grid-template-columns:repeat(${d.cols},minmax(0,1fr));grid-template-rows:repeat(${d.rows},minmax(0,1fr));gap:5px;flex:1;min-height:0">${d.slots.map((a,i)=>`<div style="grid-column:${a.x+1}/span ${a.w};grid-row:${a.y+1}/span ${a.h};background:#102137;border:1px solid #355d7b;padding:8px;border-radius:6px;min-width:0;min-height:0;overflow:hidden"><div class="minor">${a.field||'示意指標'}（${subjects[d.subject]}）</div>${a.kind==='line'?sparkline([6,8,7,9,11,10,13]):a.kind==='bar'?'<div style="height:22px;background:linear-gradient(90deg,#56b7fa 40%,#284669 40%)"></div>':a.kind==='KPI'?`<strong>${currencies(d.subject==='capital'?'NT$ 82.0萬':'NT$ 3.5M')}</strong>`:a.kind==='quality'?'<span class="minor">Source/Cut：DEMO</span>':'<span class="minor">來源核實後顯示</span>'}</div>`).join('')}</div>`}}function render(){const root=$('dashboard');root.innerHTML=layout.map(m=>`<article class="card" data-card="${m.id}" style="grid-column:${m.x+1}/span ${m.w};grid-row:${m.y+1}/span ${m.h}">${head(m)}<div class="card-body">${body(m)}</div></article>`).join('');root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{assetTab=b.dataset.tab;assetPage=0;render()});root.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const[id,dir]=b.dataset.pg.split(':');if(id==='assets')assetPage=(assetPage+(dir==='next'?1:-1)+Math.max(1,Math.ceil((assetTab==='總覽'?assets:assets.filter(a=>a[0]===assetTab)).length/6)))%Math.max(1,Math.ceil((assetTab==='總覽'?assets:assets.filter(a=>a[0]===assetTab)).length/6));else if(id==='holdings')holdingPage=(holdingPage+(dir==='next'?1:-1)+2)%2;render()});const plot=$('trendPlot');if(plot){plot.onmousemove=e=>{const i=Math.min(5,Math.max(0,Math.floor((e.offsetX/Math.max(1,plot.clientWidth))*6)));const tip=$('trendTip');tip.hidden=false;tip.innerHTML=strategyTooltip(i);tip.style.left=Math.min(plot.clientWidth-115,Math.max(4,e.offsetX+12))+'px'};plot.onmouseleave=()=>{$('trendTip').hidden=true}}}function renderRail(){document.querySelectorAll('[data-rail]').forEach(b=>{const ico=icons[b.dataset.rail]||'□';if(ico.startsWith('data:image/')){b.innerHTML='<img alt="" style="height:25px;width:25px;object-fit:contain" src="'+ico+'">'}else b.textContent=ico;b.onclick=()=>{const k=b.dataset.rail;const f=$('flyout');if(!f.hidden&&selectedGroup===k){f.hidden=true;b.classList.remove('active');return}selectedGroup=k;document.querySelectorAll('[data-rail]').forEach(v=>v.classList.toggle('active',v.dataset.rail===k));$('flyhead').textContent=({portfolio:'投資組合',market:'市場／圖表',lab:'實驗室',schedule:'更新／排程',engineering:'工程／審核'})[k];$('flylinks').innerHTML=(railLinks[k]||[]).map(x=>`<button class="link">${x}</button>`).join('');f.hidden=false}})}function modal(title,body,mode,saveLabel='儲存'){dialogMode=mode;$('dlgTitle').textContent=title;$('dlgBody').innerHTML=body;$('dlgSave').textContent=saveLabel;$('shade').hidden=false;document.querySelector('.dialog').style.height=mode==='layout'?'min(850px,94dvh)':'min(800px,94dvh)'}function closeModal(returnToSettings=false){$('shade').hidden=true;dialogMode='';if(returnToSettings){openSettings(settingPage)}}$('closeDialog').onclick=()=>closeModal(['layout','module'].includes(dialogMode));$('dlgCancel').onclick=()=>closeModal(['layout','module'].includes(dialogMode));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('shade').hidden){e.preventDefault();closeModal(['layout','module'].includes(dialogMode))}else if(e.key==='Escape'){$('flyout').hidden=true}});$('flyclose').onclick=()=>{$('flyout').hidden=true;document.querySelectorAll('[data-rail]').forEach(b=>b.classList.remove('active'))};$('stateSel').onchange=render;$('filterButton').onclick=()=>toast('篩選規則預設沿用 D1 v1.3，詳細篩選將於 UI08 核對');$('settingsEntry').onclick=()=>openSettings();$('quickEdit').onclick=()=>openQuick();function openSettings(tab='palette'){settingPage=tab;const tabs=[['palette','面板／配色'],['workbench','工作台版型'],['modul  return `<div class="d1-trendwrap">${d1Stamp(m)}<div class="d1-trendtop"><strong>${d1UiAmount(last*10000)}</strong><span class="${d>=0?'change':'loss'}">${d1UiAmount(d*10000)} (${d1UiPct(before?d/before*100:0)})</span></div><div class="tabs">${Object.keys(d1PeriodsLabels).map(p=>`<button class="small ${d1Period===p?'current':''}" data-d1period="${p}">${p}</button>`).join('')}</div><div class="d1-trend-main" id="trendPlot"><svg viewBox="0 0 660 255" class="d1-trend-svg" preserveAspectRatio="none" role="img" aria-label="總值折線及每一期各策略金額獨立柱狀，滑鼠查看相較前期變化，DEMO 數據"><line x1="16" x2="648" y1="207" y2="207" stroke="#6c839e" stroke-dasharray="4,4"/>${lines}${bars}</svg><div class="d1-trend-tooltip" id="trendTip" hidden></div></div><div class="d1-strategy-legend">${legend}</div><div class="minor">${d1Period}｜萬 TWD · 合成數據；每期獨立色柱＝各策略當期金額；懸停可查前期差額及百分比</div></div>`;
}
function d1Tip(m,i){const series=d1SeriesFor(m),labels=d1PeriodsLabels[d1Period],total=j=>series.reduce((n,s)=>n+s.values[j],0),now=total(i),pre=i?total(i-1):now,d=now-pre;
 return `<b>${labels[i]}｜總額 ${d1Money(now*10000)}</b>${i?`<div>總差 ${d1Money(d*10000)}（${d1Pct(pre?d/pre*100:0)}）</div>`:'<div>基準期：無前一期</div>'}${series.map(s=>{const v=s.values[i],prev=i?s.values[i-1]:v,delta=v-prev;return `<div>${s.name} ${d1Money(v*10000)}｜${i?`${d1Money(delta*10000)}（${d1Pct(prev?delta/prev*100:0)}）`:'基準'}</div>`}).join('')}<small>DEMO ${d1PortfolioSets[d1SubjectFor(m)].cut}</small>`;
}
const d1News=['持有標的最新摘要：來源待驗證','市場指數／融資利率與觀測資料：示意','原物料價格與利率消息：授權待查'];
body=function(m){const f=d1Factor(m),idx=d1SubjectFor(m),bad=d1Truth()==='UNKNOWN';
 if(m.id==='overview')return `<div class="minor">${d1Stamp(m)} · 帳戶權益合成示意</div><div class="metric-line"><span>投資組合總值</span><strong class="change">${d1UiPct(6.2*f)}</strong></div><div class="big">${d1UiAmount(3500000*f)}</div><div class="metric-line"><span>前期變化 ${d1UiAmount(204000*f)}</span><span class="minor">近一年</span></div>`;
 if(m.id==='capital'){
 const periodIndex=['日','週','雙週','月'].indexOf(d1CashPeriod),deltas=[15000,-39000,52000,82000],delta=deltas[periodIndex]*f,base=820000*f,prev=base-delta;
 return `<div class="minor">${d1Stamp(m)} · 目前資金</div><div class="big">${d1UiAmount(base)}</div><div class="tabs">${['日','週','雙週','月'].map(p=>`<button class="small ${p===d1CashPeriod?'current':''}" data-cashperiod="${p}">${p}</button>`).join('')}</div>${bad?'<div class="minor">資料狀態 UNKNOWN，不顯示假走勢</div>':sparkline([73,76,72,81,78,83,82].map(x=>x*f*(1+periodIndex*.05)))}<div class="metric-line"><span>${d1CashPeriod}變化</span><b class="${delta>=0?'change':'loss'}">${d1UiAmount(delta)}　${d1UiPct(delta/prev*100)}</b></div>`;
 }
 if(m.id==='strategy')return `<div class="minor">${d1Stamp(m)} · 策略績效</div>${d1SeriesFor(m).slice(0,4).map((s,i)=>`<div class="metric-line"><span>${s.name}</span><b class="${i===2?'loss':'change'}">${bad?'—':d1UiPct((s.values.at(-1)-s.values.at(-2))/s.values.at(-2)*100)}</b></div><div style="height:5px;border-radius:4px;background:var(--border)"><div style="height:5px;width:${45+i*12}%;border-radius:4px;background:${s.color}"></div></div>`).join('')}`;
 if(m.id==='trend')return d1Chart(m);
 if(m.id==='allocation'&&bad)return `<div class="minor">${d1Stamp(m)} · UNKNOWN</div><p>資產權重未確認，不能推定為零或可用占比。</p>`;
 if(m.id==='allocation')return `<div class="minor">${d1Stamp(m)} · 資產配置</div><div style="display:flex;justify-content:center;align-items:center;min-height:110px"><div style="width:112px;height:112px;border-radius:50%;background:conic-gradient(#38a7b9 0 26%,#678de2 26% 55%,#b49b5d 55% 71%,#8e6fbe 71% 86%,#3ab490 86% 100%);display:grid;place-items:center"><div style="border-radius:50%;width:62px;height:62px;background:var(--card);display:grid;place-items:center">資產</div></div></div><div class="metric-line"><span>股票 23.9%</span><span>債券 ETF 28.9%</span></div><div class="metric-line"><span>期貨 18.1%</span><span>現金及其他 29.1%</span></div>`;
 if(m.id==='news')return `<div class="minor">NEWS · SOURCE UNVERIFIED</div><strong>${d1News[d1NewsIndex]}</strong><p>來源待核實 · 非即時行情</p><div class="metric-line"><span class="status">UNVERIFIED</span><span>${d1NewsIndex+1}/3</span></div>`;
 if(m.id==='assets'){
 const tabs=['總覽','股票','債券 ETF','長期 ETF','台灣期貨','現金','其他','債券','海外股票'];const d=d1ShownAssets(),pages=Math.max(1,Math.ceil(d.length/6));assetPage=Math.min(assetPage,pages-1);
 const chooser=assetTab==='總覽'?`<details class="d1-asset-chooser"><summary>☑ 顯示類別</summary>${assets.map(a=>a[0]).filter((v,i,arr)=>arr.indexOf(v)===i).map(c=>`<label><input type="checkbox" data-showasset="${c}" ${d1AssetDisplay.has(c)?'checked':''}>${c}</label>`).join('')}</details>`:'';
 return `<div class="tabs">${tabs.map(t=>`<button class="small ${assetTab===t?'current':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="controlrow wrap-controls">${chooser}<label>排序<select id="d1AssetSort"><option value="amount" ${d1SortKey==='amount'?'selected':''}>金額</option><option value="return" ${d1SortKey==='return'?'selected':''}>投報</option></select></label><button class="small" id="d1AssetOrder">${d1SortAsc?'↑ 小到大':'↓ 大到小'}</button><span class="minor">範圍：${assetTab}</span></div><div class="asset-grid">${Array.from({length:6},(_,i)=>{const a=d[assetPage*6+i];return a?`<div class="asset"><b>${a[0]}</b><section><span class="minor">${d1Stamp(m)}</span><strong>${d1UiAmount(parseFloat(a[1].replaceAll(',',''))*f)}</strong>${bad?'<div class="minor">UNKNOWN</div>':sparkline([12+i,15+i,13+i,21+i,23+i,22+i].map(x=>x*f))}<span class="${a[2].startsWith('-')?'loss':'change'}">${bad?'—':a[2]}</span></section></div>`:`<div class="asset placeholder" aria-hidden="true"></div>`}).join('')}</div>`;
 }
 if(m.id==='holdings'){
 const d=Array.from({length:8},(_,i)=>['TXF / ETF / Stock '+(i+1),(700000-i*67000)*f,`${i%2?'-':'+'}${((i+1)*.6).toFixed(1)}%`]);
 d.sort((a,b)=>{const k=d1SortKey==='amount'?1:2,parse=x=>Number.parseFloat(String(x));return (d1SortAsc?1:-1)*(parse(a[k])-parse(b[k]))});
 return `<div class="controlrow wrap-controls"><span class="minor">${d1Stamp(m)} · 六筆固定容量</span><button class="small" data-view="list" ${d1HoldingView==='list'?'aria-pressed="true"':''}>☷ 條列</button><button class="small" data-view="card" ${d1HoldingView==='card'?'aria-pressed="true"':''}>▦ 簡易</button><label>排序<select id="d1HoldingSort"><option value="amount" ${d1SortKey==='amount'?'selected':''}>金額</option><option value="return" ${d1SortKey==='return'?'selected':''}>投報</option></select></label><button class="small" id="d1HoldingOrder">${d1SortAsc?'↑':'↓'}</button>${pager('holdings',holdingPage,2)}</div><div class="data-rows ${d1HoldingView==='card'?'simple-cards':''}">${Array.from({length:6},(_,i)=>{const a=d[holdingPage*6+i];return a?`<div class="data-row"><strong>${a[0]}</strong><span>${d1UiAmount(a[1])}</span><span class="${a[2][0]==='-'?'loss':'change'}">${bad?'—':a[2]}</span></div>`:`<div class="data-row empty" aria-hidden="true">—</div>`}).join('')}</div>`;
 }
 return d1OriginalBody(m);
};
function d1PostRender(){d1AddPortfolioSelector();
 document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const id=b.dataset.pin;if(Object.prototype.hasOwnProperty.call(d1CardPins,id))delete d1CardPins[id];else d1CardPins[id]=d1SubjectFor(layout.find(m=>m.id===id));render()});
 document.querySelectorAll('[data-cprev],[data-cnext]').forEach(b=>b.onclick=()=>{const id=b.dataset.cprev||b.dataset.cnext;const prev=d1SubjectFor(layout.find(m=>m.id===id));d1CardPins[id]=(prev+(b.dataset.cprev?3:1))%4;render()});
 document.querySelectorAll('[data-cashperiod]').forEach(b=>b.onclick=()=>{d1CashPeriod=b.dataset.cashperiod;render()});
 document.querySelectorAll('[data-d1period]').forEach(b=>b.onclick=()=>{d1Period=b.dataset.d1period;render()});
 document.querySelectorAll('[data-showasset]').forEach(b=>b.onchange=()=>{if(b.checked)d1AssetDisplay.add(b.dataset.showasset);else d1AssetDisplay.delete(b.dataset.showasset);assetPage=0;render()});
 if($('d1AssetSort'))$('d1AssetSort').onchange=e=>{d1SortKey=e.target.value;assetPage=0;render()};
 if($('d1HoldingSort'))$('d1HoldingSort').onchange=e=>{d1SortKey=e.target.value;holdingPage=0;render()};
 for(const id of ['d1AssetOrder','d1HoldingOrder'])if($(id))$(id).onclick=()=>{d1SortAsc=!d1SortAsc;render()};
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{d1HoldingView=b.dataset.view;render()});
 const m=layout.find(v=>v.id==='trend'),plot=$('trendPlot');if(plot&&m){
 const tip=$('trendTip');plot.onmousemove=e=>{const box=plot.getBoundingClientRect(),u=Math.min(5,Math.max(0,Math.round((e.clientX-box.left)/box.width*5)));tip.hidden=false;tip.innerHTML=d1Tip(m,u);tip.style.left=Math.max(3,Math.min(box.width-235,e.clientX-box.left+8))+'px';tip.style.top='8px';};plot.onmouseleave=()=>tip.hidden=true;
 }
 const pp=Array.from(document.querySelectorAll('[data-pg]')).filter(b=>b.dataset.pg?.startsWith('news:'));pp.forEach(b=>b.onclick=()=>{d1NewsIndex=(d1NewsIndex+(b.dataset.pg.endsWith('next')?1:2))%3;render()});
 }
render=function(){d1OriginalRender();d1PostRender()};
function d1FeatureById(id){return d1AllFeatures.find(x=>x[0]===id)}
function d1SearchFeature(q){const t=q.toLowerCase().trim();return t?d1AllFeatures.filter(x=>x[1].toLowerCase().includes(t)||x[0].toLowerCase().includes(t)).slice(0,15):[]}
function d1RenderQuick(){railLinks=Object.fromEntries(Object.entries(d1ShortcutItems).map(([k,ids])=>[k,ids.map(id=>d1FeatureById(id)?.[1]||id)]));
 renderRail();document.querySelectorAll('[data-rail]').forEach(b=>{b.hidden=!(d1ShortcutItems[b.dataset.rail]||[]).length;b.title=d1Categories[b.dataset.rail]});
}

 b.hidden=!(d1ShortcutItems[b.dataset.rail]||[]).length;
 b.title=d1Categories[b.dataset.rail];
 b.onclick=()=>{const k=b.dataset.rail,f=$('flyout');if(!f.hidden&&selectedGroup===k){f.hidden=true;return}selectedGroup=k;document.querySelectorAll('[data-rail]').forEach(x=>x.classList.toggle('active',x.dataset.rail===k));$('flylinks').innerHTML=(d1ShortcutItems[k]||[]).map(id=>{const v=d1FeatureById(id);return `<button class="link" data-link="${id}">${v?.[1]||id}</button>`}).join('');f.hidden=false;f.querySelectorAll('[data-link]').forEach(x=>x.onclick=()=>{toast((d1FeatureById(x.dataset.link)?.[1]||x.dataset.link)+' · 設計預覽，尚無正式頁面連線');hideRail()})}
 });
};
function d1QuickEditor(){d1ShortcutDraft=clone(d1ShortcutItems);d1ShortcutDraftStyle=d1ShortcutStyle;d1ShortcutDraftSpacing=d1ShortcutSpacing;editIcons=clone(icons);
 modal('左側快捷 · 功能與圖示設定',`<div class="quick-body-grid"><section class="quick-scroll"><h3>已選快捷</h3><div id="d1SelectedQuick"></div></section><section class="quick-scroll"><h3>依分類選取功能（UI01～UI19）</h3><input type="search" id="d1QuickSearch" placeholder="搜尋：頁面、功能、UI 編號" style="width:100%"><div id="d1QuickCatalog"></div></section></div><div class="quick-optrow"><label>顯示<select id="d1QuickStyle"><option value="icon">ICON</option><option value="both">ICON＋文字</option><option value="text">文字</option></select></label><label>項目間距<select id="d1QuickSpacing"><option value="4">精簡</option><option value="6">標準</option><option value="9">寬鬆</option></select></label><details><summary>分類 ICON（24 個預設圖案）</summary><div id="d1QuickIconPicker"></div></details><button id="d1QuickExport" type="button">匯出快捷 JSON</button></div>`,'quick','儲存快捷');
 $('d1QuickStyle').value=d1ShortcutDraftStyle;$('d1QuickSpacing').value=String(d1ShortcutDraftSpacing);
 $('d1QuickStyle').onchange=e=>{d1ShortcutDraftStyle=e.target.value};$('d1QuickSpacing').onchange=e=>{d1ShortcutDraftSpacing=+e.target.value};
 $('d1QuickSearch').oninput=d1PaintQuick;

function d1PaintQuick(){const s=$('d1SelectedQuick'),c=$('d1QuickCatalog');if(!s||!c)return;
 s.innerHTML=Object.entries(d1ShortcutDraft).map(([g,list])=>list.length?`<div class="quick-cat">${d1Categories[g]}</div>${list.map((id,i)=>`<div class="quick-item"><span>${d1FeatureById(id)?.[1]||id}</span><span><button class="small" data-up="${g}:${i}">↑</button><button class="small" data-down="${g}:${i}">↓</button><button class="small" data-remove="${id}">－</button></span></div>`).join('')}`:'').join('');
 s.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{const z=(b.dataset.up||b.dataset.down).split(':'),arr=d1ShortcutDraft[z[0]],i=+z[1],j=i+(b.dataset.up?-1:1);if(j>=0&&j<arr.length){[arr[i],arr[j]]=[arr[j],arr[i]];d1PaintQuick()}});

 const q=$('d1QuickSearch').value.trim().toLowerCase();
 c.innerHTML=Object.entries(d1Features).map(([g,features])=>{const filtered=features.filter(x=>!q||x[1].toLowerCase().includes(q)||x[0].toLowerCase().includes(q));return filtered.length?`<div class="quick-cat">${d1Categories[g]}</div>${filtered.map(([id,name])=>{const ck=(d1ShortcutDraft[g]||[]).includes(id);return `<button class="quick-feature ${ck?'checked':''}" data-toggle="${id}" data-group="${g}" type="button"><span>${ck?'☑':'☐'} ${name}</span><small>${ck?'已選':'＋'}</small></button>`}).join('')}`:''}).join('');
 c.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const g=b.dataset.group,id=b.dataset.toggle,a=d1ShortcutDraft[g];const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);d1PaintQuick()});

function d1PaintIcons(){const e=$('d1QuickIconPicker');if(!e)return;e.innerHTML=`<div class="grid2">${Object.keys(d1Categories).map(g=>`<label class="formfield">${d1Categories[g]}<select data-icongroup="${g}">${d1IconOptions.map((icon,i)=>`<option value="${i}" ${editIcons[g]===icon?'selected':''}>${icon}</option>`).join('')}<option value="import">＋ 匯入圖示（最後一項）</option></select></label>`).join('')}</div><label class="formfield" id="d1IconImportWrap" hidden>匯入 PNG／WebP（250KB 上限）<input id="d1IconFile" type="file" accept="image/png,image/webp"></label><img id="d1IconPreview" alt="ICON 預覽" style="display:none;width:42px;height:42px">`;
 e.querySelectorAll('[data-icongroup]').forEach(b=>b.onchange=()=>{const g=b.dataset.icongroup;if(b.value==='import'){$('d1IconImportWrap').hidden=false;$('d1IconFile').dataset.group=g}else{editIcons[g]=d1IconOptions[+b.value];$('d1IconImportWrap').hidden=true}});

$('dlgSave').onclick=e=>{if(dialogMode==='quick'&&d1ShortcutDraft){d1ShortcutItems=clone(d1ShortcutDraft);icons=clone(editIcons);d1ShortcutStyle=d1ShortcutDraftStyle;d1ShortcutSpacing=d1ShortcutDraftSpacing;document.querySelector('.rail').style.gap=d1ShortcutSpacing+'px';renderRail();closeModal();toast('快捷已儲存（本頁設計草案）');return}d1PriorSave(e)};

 if(tab==='palette'&&footer){const pane=document.createElement('div');pane.innerHTML=`<details><summary>字體與數字分組設定</summary><div class="d1-profile-actions"><label>導覽字體 <select id="d1FontNav"><option>Arial／微軟正黑體</option></select></label><label>介面字級 <select id="d1FontSize"><option value="100">100%</option><option value="110">110%</option><option value="125">125%</option><option value="150">150%</option></select></label><label>數字顯示 <select id="d1NumberFont"><option>等寬數字</option></select></label></div></details><details><summary>自訂色板（本機設計草稿）</summary><label>名稱 <input id="d1PaletteName" placeholder="我的色板"></label><button id="d1PaletteAdd">＋ 保存當前配色</button><select id="d1PaletteSelect"></select><button id="d1PaletteApply">套用</button><button id="d1PaletteDelete">刪除</button></details>`;footer.append(pane);
 const renderPalettes=()=>{$('d1PaletteSelect').innerHTML=(window.d1Palettes||[]).map((p,i)=>`<option value="${i}">${p.name}</option>`).join('')};renderPalettes();

 }
};

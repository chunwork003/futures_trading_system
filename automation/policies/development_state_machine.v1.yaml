schema_version: automation.development_state_machine.v1
policy_id: DEVELOPMENT-STATE-MACHINE
policy_version: "1.0"
status: CANDIDATE_FOR_TARGETED_RE_REVIEW

axes:
  authorization:
    - NOT_AUTHORIZED
    - AUTHORIZED
    - RESERVED
    - CONSUMED
    - SUPERSEDED
    - REVOKED
  execution:
    - IDLE
    - QUEUED
    - PRE_DISPATCH
    - RUNNING
    - RESULT_READY
    - STOPPED
  quota:
    - UNKNOWN
    - READY
    - TIGHT
    - WAIT_5H
    - WAIT_WEEKLY
    - RECHECK_REQUIRED
  review:
    - NOT_SUBMITTED
    - PENDING
    - FIX_REQUIRED
    - ACCEPTED
    - REJECTED

required_invariants:
  - NOT_AUTHORIZED_CANNOT_REACH_EXECUTING
  - RESULT_READY_CANNOT_DIRECTLY_REACH_ACCEPTED
  - QUOTA_WAIT_CANNOT_DIRECTLY_REACH_EXECUTING
  - REVIEW_FIX_REQUIRED_CANNOT_DIRECTLY_REACH_ACCEPTED
  - ARCHITECTURE_BLOCKED_CANNOT_DISPATCH
  - AUTO_3_HAS_NO_UNATTENDED_PATH
  - ONE_ACTIVE_RUNTIME_WRITER
  - REVIEWER_PASS_IS_NOT_GOVERNANCE_MATERIALIZATION
  - INTERNAL_WAVE_FROZEN_IS_NOT_ACCEPTED

quota_wait_reentry:
  required_path:
    - QUOTA_WAIT
    - RE_RESOLVING
    - ELIGIBILITY_RESOLVING
    - QUOTA_EVALUATION
  old_dispatch_decision_reusable: false

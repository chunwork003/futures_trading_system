  pause_consumes_correction_budget: false
  result_ready_is_accepted: false
invariants:
- PROVIDER_ACTUAL_DENIAL_WINS
- NO_AUTHORITY_CREATION
- HISTORICAL_PHASE_SNAPSHOT != CURRENT_LIFECYCLE_PROJECTION
- CONTRADICTORY_CURRENT_PROJECTION_FAIL_CLOSED_RECONCILIATION_REQUIRED
- REVIEW_PASS != INTEGRATION_PASS != MATERIALIZED_ACCEPTANCE

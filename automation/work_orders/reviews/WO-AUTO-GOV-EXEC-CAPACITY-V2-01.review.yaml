      "patch": "@@ -0,0 +1,61 @@\n+schema_version: automation.execution_cost_contract.v2\n+policy_id: EXECUTION_COST_CONTRACT\n+policy_version: '2.0'\n+status: CANDIDATE_PENDING_INDEPENDENT_GOVERNANCE_REVIEW\n+active: false\n+authority:\n+  active_master_architecture: '1.1'\n+  target_architecture: '1.2'\n+  activation: WORK_MATERIALIZATION_AFTER_FRESH_INDEPENDENT_GOVERNANCE_REVIEW_PASS\n+  side_effects:\n+    runtime: DENIED\n+    broker: DENIED\n+    db: DENIED\n+    migration: DENIED\n+    live: DENIED\n+    production: DENIED\n+semantics:\n+  units:\n+    local_exact_bound_tokens: EXACT_ACTUAL_USAGE_NOT_BILLING\n+    raw_provider: PROVIDER_REPORTED_SHARED_ACCOUNT_USAGE_PROXY\n+    derived_capacity: PROVISIONAL_ESTIMATE_OR_CALIBRATED_ESTIMATE_NEVER_EXACT\n+    billing: ONLY_EXPLICIT_EXACT_PROVIDER_TASK_COST\n+  actual_required:\n+  - actor_start\n+  - actor_end\n+  - test_cycles\n+  - targeted_seconds\n+  - full_regression_seconds\n+  - tool_retries\n+  - raw_provider_before_after\n+  - task_profile\n+  - actual_context_profile\n+  - local_token_status\n+  optional_interruption:\n+  - provider_limit_encountered\n+  - provider_pause_count\n+  - provider_pause_seconds\n+  - resume_count\n+  - resumed_same_execution\n+  - capacity_forecast_at_start\n+  - capacity_estimate_at_start\n+  - forecast_capacity_review_required\n+  local_tokens_during_active_session: PENDING_EXTERNAL_EXTRACTION\n+  raw_mutation: DENIED\n+  extractor: scripts/codex_session_token_usage.ps1\n+  review_trigger: ANY_RUNNING_PROVIDER_LIMIT_INTERRUPTION\n+  review_blocks_legal_resume: false\n+  review_materialized_before_new_work_after_completion: true\n+  review_type: WORK_FORECAST_CAPACITY_REVIEW_NOT_SOURCE_DEFECT_OR_SEMANTIC_REVIEW\n+invariants:\n+- PROVIDER_ACTUAL_DENIAL_WINS\n+- NO_AUTHORITY_CREATION\n+- HISTORICAL_PHASE_SNAPSHOT != CURRENT_LIFECYCLE_PROJECTION\n+- CONTRADICTORY_CURRENT_PROJECTION_FAIL_CLOSED_RECONCILIATION_REQUIRED\n+- REVIEW_PASS != INTEGRATION_PASS != MATERIALIZED_ACCEPTANCE\n+- IVF01_BLOCKED_UNTIL_REVIEWED_1_2_ACTIVATION_THEN_REV1_STALE\n+- AUTO_IMP_003_NOT_AUTHORIZED\n+historical:\n+  predecessor_path: automation/telemetry/execution_cost_contract.v1.yaml\n+  immutable: true\n+  not_retroactively_active: true",

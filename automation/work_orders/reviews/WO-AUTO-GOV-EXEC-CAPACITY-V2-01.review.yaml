      "patch": "@@ -0,0 +1,47 @@\n+schema_version: automation.work_cost_accounting.v2\n+policy_id: WORK_COST_ACCOUNTING\n+policy_version: '2.0'\n+status: CANDIDATE_PENDING_INDEPENDENT_GOVERNANCE_REVIEW\n+active: false\n+authority:\n+  active_master_architecture: '1.1'\n+  target_architecture: '1.2'\n+  activation: WORK_MATERIALIZATION_AFTER_FRESH_INDEPENDENT_GOVERNANCE_REVIEW_PASS\n+  side_effects:\n+    runtime: DENIED\n+    broker: DENIED\n+    db: DENIED\n+    migration: DENIED\n+    live: DENIED\n+    production: DENIED\n+semantics:\n+  forecast: P50_P75_P90_BY_DEMAND_DIMENSION_WITH_CONFIDENCE_AND_UNCERTAINTY\n+  context: ACTUAL_READS_NOT_PLANNING_PROFILE\n+  units: EXACT_LOCAL_USAGE_SEPARATE_PROVIDER_PROXY_SEPARATE_CAPACITY_ESTIMATES\n+  interruption: SEPARATE_PAUSE_TIME_RESUME_COUNT_AND_CAPACITY_ERROR_FROM_SOURCE_CORRECTION\n+  review_dimensions:\n+  - forecast_vs_exact\n+  - provider_movement\n+  - capacity_error\n+  - cached_replay\n+  - uncached_context\n+  - output_reasoning\n+  - test_cycles\n+  - tool_retries\n+  - context_reload\n+  - reset_competing_consumer_ambiguity\n+  feedback: BOUNDED_RECOMMENDATION_BEFORE_NEXT_WO_NOT_AUTHORITY\n+  calibration: MINIMUM_THREE_COMPARABLE_SAMPLES_PLUS_IDENTITY_CLEAN_ATTRIBUTION_NOT_COUNT_ONLY\n+  billing_inference: DENIED\n+invariants:\n+- PROVIDER_ACTUAL_DENIAL_WINS\n+- NO_AUTHORITY_CREATION\n+- HISTORICAL_PHASE_SNAPSHOT != CURRENT_LIFECYCLE_PROJECTION\n+- CONTRADICTORY_CURRENT_PROJECTION_FAIL_CLOSED_RECONCILIATION_REQUIRED\n+- REVIEW_PASS != INTEGRATION_PASS != MATERIALIZED_ACCEPTANCE\n+- IVF01_BLOCKED_UNTIL_REVIEWED_1_2_ACTIVATION_THEN_REV1_STALE\n+- AUTO_IMP_003_NOT_AUTHORIZED\n+historical:\n+  predecessor_path: automation/specs/work_cost_accounting.v1.yaml\n+  immutable: true\n+  not_retroactively_active: true",

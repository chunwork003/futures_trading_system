ECTION\n+- CONTRADICTORY_CURRENT_PROJECTION_FAIL_CLOSED_RECONCILIATION_REQUIRED\n+- REVIEW_PASS != INTEGRATION_PASS != MATERIALIZED_ACCEPTANCE\n+- IVF01_BLOCKED_UNTIL_REVIEWED_1_2_ACTIVATION_THEN_REV1_STALE\n+- AUTO_IMP_003_NOT_AUTHORIZED\n+historical:\n+  predecessor_path: automation/policies/quota_admission_policy.v1_1.yaml\n+  immutable: true\n+  not_retroactively_active: true",

schema_version: automation.negative_assertions.v1
spec_id: AUTOMATION-NEGATIVE-ASSERTIONS
spec_version: "1.0"
status: FROZEN

authorization:
  CE-01:
    condition: consumed_authorization_and_scheduler_restart
    expected: NO_REDISPATCH
  CE-02:
    condition: work_package_revision_changed_after_authorization
    expected: AUTHORIZATION_REVISION_MISMATCH_NOT_EXECUTABLE
  CE-03:
    condition: architecture_bundle_hash_changed_after_wp_compile
    expected: PACKAGE_STALE_RECOMPILE_REQUIRED
  CE-14:
    condition: historical_authorization_superseded
    expected: DENIED

quota:
  CE-06:
    condition: "p90=10 remaining=11 reserve=3"
    expected: "safe_budget=8; NOT_FIT"
  CE-17:
    condition: reset_timestamp_passed_backend_quota_not_reset
    expected: REMAIN_QUOTA_WAIT
  CE-21:
    condition: head_authorization_dependency_or_policy_changed_during_quota_wait
    expected: FRESH_FULL_RERESOLUTION_REQUIRED

telemetry:
  TEL-001:
    condition: executor_without_machine_readable_usage
    expected: NOT_DISPATCHABLE
  TEL-002:
    condition: session_binding_ambiguous
    expected: STOP_TELEMETRY
  TEL-003:
    condition: manual_token_value_used_as_primary_evidence
    expected: REJECT

reentry:
  REENTRY-001:
    condition: user_says_continue_and_repository_has_exact_safe_authorized_next_route
    expected: REHYDRATE_THEN_CONTINUE_WITHOUT_REASKING
  REENTRY-002:
    condition: user_says_continue_but_architecture_or_business_decision_is_unresolved
    expected: REHYDRATE_THEN_DISCUSSION_REQUIRED
  REENTRY-003:
    condition: user_is_uncertain_about_progress
    expected: REHYDRATE_AND_REPORT_OR_ROUTE_FROM_CANONICAL_STATE
  REENTRY-004:
    condition: user_requests_status_only
    expected: NO_EXECUTION

[project]
name = "futures-trading-system"
version = "0.1.0"
description = "Taiwan futures backtesting system"
requires-python = ">=3.11"

dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
postgres = [
    "psycopg[binary]==3.3.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "aggregation*",
    "analysis*",
    "adapters*",
    "backtest*",
    "cleaning*",
    "cli*",
    "domain*",
    "features*",
    "persistence*",
    "storage*",
    "strategy*",
    "trading*",
    "trading_calendar*",
]
